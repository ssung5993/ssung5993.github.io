<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수의학 정리본 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#16201d; --muted:#5d6b67; --line:#d6dedb;
  --accent:#1e6b58; --accent-ink:#ffffff; --accent-soft:#e1eee8; --danger:#b23f2d;
  --good:#1d7a4a; --good-soft:#e2f4ea; --bad:#c23a2b; --bad-soft:#fbe7e4;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1413; --surface:#162120; --ink:#e4ece9; --muted:#93a29d; --line:#283533;
  --accent:#62c4a5; --accent-ink:#0b1a16; --accent-soft:#1a302a; --danger:#e47d68; --good:#5fd394; --good-soft:#163526; --bad:#f08a78; --bad-soft:#3a1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1413; --surface:#162120; --ink:#e4ece9; --muted:#93a29d; --line:#283533;
  --accent:#62c4a5; --accent-ink:#0b1a16; --accent-soft:#1a302a; --danger:#e47d68; --good:#5fd394; --good-soft:#163526; --bad:#f08a78; --bad-soft:#3a1d19; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.top-line{display:flex;justify-content:space-between;align-items:center;gap:12px}
.theme-btn{flex:0 0 auto;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-size:clamp(26px,6vw,34px);line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}

.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.cats::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;text-align:left}
.chip .code{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.chip .nm{font-weight:600;font-size:14px;white-space:nowrap}
.chip .nm small{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .code,.chip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.8}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.toolbar{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}

.upload{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.upload h2{margin:0;font-size:15px}
.upload .fields{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.upload select,.upload input[type=file]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
.upload .hint{font-size:12.5px;color:var(--muted);margin:0}
.msg{font-size:13px;margin:0}
.msg.err{color:var(--danger)}

.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.section-head h2{font-family:var(--display);font-size:20px;margin:0}
.section-head span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;width:100%}
.row:hover .t{color:var(--accent)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--muted);min-width:52px;text-align:center}
.row .main{min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .go{color:var(--muted);font-size:18px}
.empty{padding:36px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.empty strong{color:var(--ink);font-weight:600}

.reader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10}
.reader-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.reader-bar .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.reader-bar .ttl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-bar .ttl span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.edit-panel{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:12px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.edit-field{display:flex;flex-direction:column;gap:4px;flex:1 1 260px;min-width:0;font-size:12px;color:var(--muted)}
.edit-field.narrow{flex:0 1 160px}
.edit-field input,.edit-field select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.edit-actions{display:flex;gap:8px}
.edit-panel .msg{flex-basis:100%}
.reader iframe{flex:1;border:0;width:100%;background:#fff}
.reader .loading{flex:1;display:grid;place-items:center;color:var(--muted)}

/* 모드 탭 */
.modes{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;align-self:flex-start}
.mode{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px 16px;border-radius:7px;cursor:pointer}
.mode[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.row .m .best{color:var(--good)}
.gen{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.gen h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.gen h2 .spark{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px}
.gen .fields{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.gen label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.gen label.grow{flex:1 1 260px}
.gen select,.gen input[type=text]{box-sizing:border-box;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.gen .status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.gen .status.err{color:var(--danger)}
.refs{display:flex;flex-direction:column;gap:8px}
.refs .lbl{font-size:12px;color:var(--muted)}
.refpick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.refpick input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.refbtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.refbtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px}
.fchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.fchip .ty{font-family:var(--mono);font-size:10px;color:var(--muted)}
.fchip button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:50%}
.fchip button:hover{color:var(--danger)}
.gen .hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.55}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.gen-badge{display:inline-block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.subhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:22px;padding:0 4px 6px;border-bottom:1px solid var(--line)}
.subhead:first-child{margin-top:4px}
.subhead h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.subhead h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent)}
.subhead.brief h3::before{background:var(--good)}
.subhead span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.subempty{padding:16px 4px;color:var(--muted);font-size:14px}
.kind-pill{display:inline-block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--good);border:1px solid var(--good);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
/* 퀴즈 화면 */
.qprog{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qtrack{height:4px;background:var(--line)}
.qtrack div{height:100%;background:var(--accent);width:0;transition:width .25s}
.qbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.qinner{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:16px}
.qnum{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--accent)}
.qtext{font-size:18px;line-height:1.65;font-weight:600;margin:0;white-space:pre-line;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:14px;font:inherit;font-size:16px;line-height:1.5;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--muted)}
.opt .tx{min-width:0;overflow-wrap:anywhere}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{border-color:var(--good);background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox .opt{grid-template-columns:1fr;justify-items:center;text-align:center;padding:22px 10px;font-size:28px;font-weight:700}
.ox .opt .k{display:none}
.hintline{font-size:13px;color:var(--muted);margin:-6px 0 0}
.myans{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;line-height:1.55;background:var(--surface);color:var(--ink);resize:vertical}
.verdict{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface)}
.verdict b{font-size:16px}
.verdict.ok b{color:var(--good)}
.verdict.no b{color:var(--bad)}
.verdict p{margin:0;line-height:1.65;white-space:pre-line}
.verdict .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.qactions{display:flex;flex-wrap:wrap;gap:10px}
.btn.big{padding:12px 20px;font-size:16px}
.btn.good{border-color:var(--good);background:var(--good);color:var(--surface)}
.btn.bad{border-color:var(--bad);background:transparent;color:var(--bad)}
.qhead h2{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
.qfacts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px}
.qfacts b{color:var(--ink);font-variant-numeric:tabular-nums}
.qnote{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:0;line-height:1.6}
.qopt{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.qopt input{width:18px;height:18px;accent-color:var(--accent)}
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score .pct{font-family:var(--mono);color:var(--muted)}
.review{display:flex;flex-direction:column;gap:12px}
.review h3{font-size:15px;margin:8px 0 0}
.rv{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.rv .q{font-weight:600;white-space:pre-line}
.rv .mine{color:var(--bad);white-space:pre-line}
.rv .ans{color:var(--good);white-space:pre-line}
.rv .ex{color:var(--muted);font-size:14px;white-space:pre-line}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}.row:hover{background:var(--accent-soft)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top-line">
      <div class="eyebrow">College of Veterinary Medicine · Notes</div>
      <button id="themeBtn" class="theme-btn" type="button" aria-label="화면 테마 바꾸기"><span id="themeIcon" aria-hidden="true">☾</span><span id="themeLabel">다크</span></button>
    </div>
    <h1>수의학 정리본 아카이브</h1>
    <p class="sub" id="subLine">과목별로 모아둔 강의 정리본이에요. 제목을 누르면 바로 열려요.</p>
  </header>

  <div class="modes" role="tablist" aria-label="보기 방식">
    <button id="modeNotes" class="mode" role="tab" type="button" aria-selected="true">정리본</button>
    <button id="modeQuiz" class="mode" role="tab" type="button" aria-selected="false">문제풀기</button>
  </div>

  <nav class="cats" id="cats" aria-label="과목"></nav>

  <div class="toolbar">
    <input id="q" class="search" type="search" placeholder="제목으로 찾기" aria-label="정리본 검색">
  </div>

  <section>
    <div class="section-head"><h2 id="secTitle">전체</h2><span id="secCount"></span></div>
    <div id="list" class="list"></div>
  </section>
</div>

<div id="reader" class="reader" hidden>
  <div class="reader-bar">
    <button id="back" class="btn ghost" aria-label="목록으로">← 목록</button>
    <div class="ttl"><b id="rTitle"></b><span id="rMeta"></span></div>
  </div>
  <iframe id="frame" title="정리본"></iframe>
</div>

<div id="quiz" class="reader" hidden>
  <div class="reader-bar">
    <button id="qBack" class="btn ghost" type="button">← 목록</button>
    <div class="ttl"><b id="qTitle"></b><span id="qMeta"></span></div>
    <span id="qProg" class="qprog"></span>
  </div>
  <div class="qtrack"><div id="qFill"></div></div>
  <div id="qBody" class="qbody"></div>
</div>

<script>
/* ---------- 개인 도메인을 연결했을 때만 채우세요 ---------- */
const CONFIG = { owner: "", repo: "", branch: "main" };
/* ------------------------------------------------------- */

// 폴더 이름 = 과목 이름. GitHub 저장소에 이 이름 그대로 폴더를 만들어 HTML을 넣으면 목록에 자동으로 떠요.
const CATS=[
  {k:"surg",ko:"외과",code:"SURG"},
  {k:"saim",ko:"소동물내과",code:"SA·IM"},
  {k:"laim",ko:"대동물내과",code:"LA·IM"},
  {k:"therio",ko:"산과",code:"THERIO"},
  {k:"ai",ko:"인공수정학",code:"A.I."},
  {k:"aqua",ko:"수생의학",code:"AQUA"},
  {k:"clinpath",ko:"진단검사의학",code:"CLIN·PATH"},
  {k:"vcp",ko:"임상병리학",code:"VCP"},
  {k:"rad",ko:"방사선학",code:"RAD"}
];
const catOf=k=>CATS.find(c=>c.k===k);
const catByKo=ko=>CATS.find(c=>c.ko===ko);
// 과목 안의 칸(종류). 소동물내과는 '간단 정리본' 하위 폴더에 넣은 파일을 따로 모아 보여줌
const KINDS={saim:[{k:"full",ko:"정리본"},{k:"brief",ko:"간단 정리본"}]};
const kindOf=n=>n.kind==="brief"?"brief":"full";
const $=id=>document.getElementById(id);
let mode="notes",notes=[],loaded=false,loadErr="",cur="all",q="",openNote=null;

function repoInfo(){
  if(CONFIG.owner&&CONFIG.repo)return {...CONFIG};
  const h=location.hostname;
  if(h.endsWith(".github.io")){
    const owner=h.split(".")[0];
    const seg=location.pathname.split("/").filter(Boolean)[0];
    const repo=(seg&&!/\.html?$/i.test(seg))?decodeURIComponent(seg):h;
    return {owner,repo,branch:CONFIG.branch||"main"};
  }
  return null;
}
function encPath(p){return p.split("/").map(encodeURIComponent).join("/")}

// theme toggle
const rootEl=document.documentElement;
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function effectiveDark(){const t=rootEl.getAttribute("data-theme");if(t)return t==="dark";return !!(mq&&mq.matches)}
function paintThemeBtn(){const d=effectiveDark();$("themeIcon").textContent=d?"☀":"☾";$("themeLabel").textContent=d?"라이트":"다크";$("themeBtn").setAttribute("aria-label",d?"라이트 모드로 바꾸기":"다크 모드로 바꾸기")}
try{const saved=localStorage.getItem("vetnotes-theme");if(saved==="dark"||saved==="light")rootEl.setAttribute("data-theme",saved)}catch(e){}
$("themeBtn").onclick=()=>{const next=effectiveDark()?"light":"dark";rootEl.setAttribute("data-theme",next);try{localStorage.setItem("vetnotes-theme",next)}catch(e){}paintThemeBtn()};
if(mq&&mq.addEventListener)mq.addEventListener("change",paintThemeBtn);
paintThemeBtn();

const initHash=(location.hash||"").slice(1);
if(catOf(initHash)) cur=initHash;

function fmtSize(b){if(!b&&b!==0)return"";return b<1024*1024?Math.max(1,Math.round(b/1024))+" KB":(b/1048576).toFixed(1)+" MB"}

function renderCats(){
  const nav=$("cats");nav.textContent="";
  const all=[{k:"all",ko:"전체",code:"ALL"},...CATS];
  for(const c of all){
    const src=mode==="quiz"?allQuizSets():notes;
    const n=c.k==="all"?src.length:src.filter(x=>x.category===c.k).length;
    const b=document.createElement("button");
    b.className="chip";b.type="button";b.setAttribute("aria-pressed",String(cur===c.k));
    const code=document.createElement("span");code.className="code";code.textContent=c.code;
    const nm=document.createElement("span");nm.className="nm";nm.textContent=c.ko;
    if(mode==="quiz"?quizLoaded:loaded){const s=document.createElement("small");s.textContent=n;nm.appendChild(s)}
    b.append(code,nm);
    b.onclick=()=>{cur=c.k;try{history.replaceState(null,"",c.k==="all"?location.pathname:"#"+c.k)}catch(e){}render()};
    nav.appendChild(b);
  }
}

function emptyBox(title,text,withRetry){
  const e=document.createElement("div");e.className="empty";
  const s=document.createElement("strong");s.textContent=title;e.appendChild(s);
  if(text){const p=document.createElement("span");p.textContent=text;e.appendChild(p)}
  if(withRetry){const b=document.createElement("button");b.className="btn";b.type="button";b.textContent="다시 불러오기";b.style.alignSelf="center";b.onclick=()=>load(true);e.appendChild(b)}
  return e;
}
function render(){
  renderCats();
  const c=catOf(cur);
  $("secTitle").textContent=c?c.ko:"전체";
  if(mode==="quiz"){renderQuizList(c);return}
  let rows=cur==="all"?notes:notes.filter(n=>n.category===cur);
  if(q)rows=rows.filter(n=>(n.title||"").toLowerCase().includes(q));
  $("secCount").textContent=loaded?rows.length+"건":"";
  const list=$("list");list.textContent="";
  if(!loaded){
    list.appendChild(loadErr?emptyBox("목록을 불러오지 못했어요",loadErr,true):emptyBox("목록을 불러오는 중…"));
    return;
  }
  if(!rows.length&&!KINDS[cur]){
    list.appendChild(emptyBox(q?"찾는 제목이 없어요":(c?c.ko+" 정리본이 아직 없어요":"아직 올라온 정리본이 없어요"),q?"다른 단어로 찾아보세요.":"정리본이 올라오면 여기에 표시돼요."));
    return;
  }
  const ks=KINDS[cur];
  if(ks){
    for(const k of ks){
      const part=rows.filter(n=>kindOf(n)===k.k);
      const h=document.createElement("div");h.className="subhead"+(k.k==="brief"?" brief":"");
      const h3=document.createElement("h3");h3.textContent=k.ko;
      const sp=document.createElement("span");sp.textContent=part.length+"건";
      h.append(h3,sp);list.appendChild(h);
      if(!part.length){
        const e=document.createElement("div");e.className="subempty";
        e.textContent=q?"찾는 제목이 없어요.":k.ko+"이 올라오면 여기에 표시돼요.";
        list.appendChild(e);continue;
      }
      for(const n of part)list.appendChild(noteRow(n));
    }
    return;
  }
  for(const n of rows)list.appendChild(noteRow(n));
}
function noteRow(n){
  const r=document.createElement("button");r.className="row";r.type="button";
  const tag=document.createElement("span");tag.className="tag";tag.textContent=(catOf(n.category)||{code:"—"}).code;
  const main=document.createElement("span");main.className="main";
  const t=document.createElement("span");t.className="t";t.textContent=n.title;
  if(KINDS[n.category]&&kindOf(n)==="brief"&&cur!==n.category){const pill=document.createElement("span");pill.className="kind-pill";pill.textContent="간단";t.appendChild(pill)}
  const m=document.createElement("span");m.className="m";
  m.textContent=[(catOf(n.category)||{}).ko,fmtSize(n.size)].filter(Boolean).join(" · ");
  main.append(t,m);
  const go=document.createElement("span");go.className="go";go.textContent="›";go.setAttribute("aria-hidden","true");
  r.append(tag,main,go);
  r.onclick=()=>openReader(n);
  return r;
}

function openReader(n){
  openNote=n;
  $("rTitle").textContent=n.title;
  $("rMeta").textContent=(catOf(n.category)||{}).ko||"";
  $("frame").src=encPath(n.path);
  $("reader").hidden=false;
  document.body.style.overflow="hidden";
}
function closeReader(){openNote=null;$("reader").hidden=true;$("frame").src="about:blank";document.body.style.overflow=""}
$("back").onclick=closeReader;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("reader").hidden)closeReader()});

$("q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render()});

// 저장소 파일 목록 → 정리본 목록 (과목폴더/파일.html, 소동물내과/간단 정리본/파일.html)
const CACHE_KEY="vetnotes-tree-v2",TTL=5*60*1000;
function fromTree(tree){
  const out=[];
  for(const it of tree){
    if(it.type!=="blob")continue;
    const parts=it.path.split("/");
    if(parts.length<2||!/\.html?$/i.test(it.path))continue;
    const c=catByKo(parts[0]);if(!c)continue;
    const kind=parts.length>2&&parts[1]==="간단 정리본"?"brief":"full";
    out.push({category:c.k,kind,title:parts[parts.length-1].replace(/\.html?$/i,""),path:it.path,size:it.size});
  }
  out.sort((a,b)=>a.title.localeCompare(b.title,"ko",{numeric:true}));
  return out;
}
async function load(force){
  const info=repoInfo();
  if(!info){loadErr="GitHub 저장소를 찾지 못했어요. index.html의 CONFIG에 아이디와 저장소 이름을 적어 주세요.";render();return}
  let cached=null;
  try{cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null")}catch(e){}
  if(!force&&cached&&Date.now()-cached.t<TTL){notes=fromTree(cached.tree);loaded=true;render();return}
  loaded=false;loadErr="";render();
  try{
    const res=await fetch(`https://api.github.com/repos/${encodeURIComponent(info.owner)}/${encodeURIComponent(info.repo)}/git/trees/${encodeURIComponent(info.branch)}?recursive=1`,{headers:{Accept:"application/vnd.github+json"}});
    if(!res.ok)throw res.status;
    const data=await res.json();
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),tree:data.tree}))}catch(e){}
    notes=fromTree(data.tree);loaded=true;
  }catch(code){
    if(cached){notes=fromTree(cached.tree);loaded=true}
    else loadErr=code===403||code===429?"잠시 접속이 많았어요. 몇 분 뒤 다시 시도해 주세요.":code===404?"저장소나 브랜치 이름이 맞는지 확인해 주세요.":"인터넷 연결을 확인하고 다시 시도해 주세요.";
  }
  render();
}

  ox3:{type:"ox",q:"어미견이 사상충에 감염되었다면 자충(microfilaria)은 태반을 통해 태아로 감염이 되어 신생 강아지의 혈액에서도 자충이 발견될 수 있다.",options:OX,answer:0,

  mc6:{type:"mc",q:"심장의 전도계(conduction pathways)에서 정상적으로 자동성(automaticity)을 가지는 부위가 아닌 것은?",options:["SA(sinoatrial) node","Bundle of His","AV(atrioventricular) node","Purkinje fibers"],answer:1,

  mc9:{type:"mc",q:"다음은 심전도 기계에서 유도체계(lead system)이다. 성격이 다른 것은?",options:["lead aVF","lead aVR","lead aVL","lead V4","lead II"],answer:3,
    explanation:"V4는 흉부(전흉부) 유도예요. 나머지는 사지 유도예요(aVR·aVL·aVF는 증폭 단극 사지유도, II는 표준 양극 사지유도)."},
  mc10:{type:"mc",q:"다음은 부정맥에 대한 설명이다. 옳지 않은 것은?",options:["이탈박동(Escape beat) - 정상적인 SA node의 리듬에서 벗어나서(이탈하여) 뛰는 심장 박동","3도 방실차단(Third degree AV block) - AV node가 완전히 해리되어(dissociated) P파와 QRS 복합체의 연계성이 전혀 존재하지 않음","심방세동(Atrial fibrillation) - 매우 불규칙적이고 혼란스러운 전기적인 자극이 심방에서 발생하지만 심전도에서는 실제 P파는 형성이 없고 심실은 빈맥 상태","동성정지(Sinus arrest) - 심장의 전기적 자극이 SA node에서 발생하지 않고 오랜 시간 심장이 뛰지 않음"],answer:0,
    explanation:"이탈박동은 SA node가 멈추거나 느려져서 휴지기가 생긴 뒤, 하위 박동원(방실접합부·심실)이 대신 뛰는 '보호성' 박동이에요. 정상 리듬에서 벗어나 먼저 뛰는 건 조기박동(premature beat)이에요."},
  multi11:{type:"multi",q:"폐수종에 대한 설명으로 옳은 것을 모두 고르시오.",options:["좌심(장)부전에 의해 발생한 폐수종은 프로세마이드(furosemide)를 사용하여 치료할 수 있다.","좌심(장)부전에 의해 나타날 수 있으며 폐 모세혈관의 정수압이 증가하여 폐수종을 유발한다.","심한 발작증상을 보이는 환자에서도 발작 후 폐수종 증상을 보일 수 있으므로 실제 환자에서 이에 대한 적절한 처치가 필요하다.","저단백혈증이 있는 경우 혈장 교질삼투압이 감소하면서 폐수종이 발생할 수 있다.","응고계의 이상으로 미세혈전이 과다하게 생성되어 폐의 미세혈관을 막고 있는 현상이다."],answers:[0,1,2,3],
    explanation:"①②③④ 모두 맞아요. 심인성(정수압↑, 이뇨제 치료), 신경원성(발작 후), 저알부민혈증(교질삼투압↓) 폐수종이 모두 가능해요.\n⑤는 폐혈전색전증(PTE)에 대한 설명이에요. 폐수종이 아니에요."},
  multi12:{type:"multi",q:"다음은 실신(Syncope)과 발작(Seizure)에 대한 설명이다. 옳지 않은 것 2개를 고르시오.",options:["발작은 전조증상을 보이고 발작하는 동안 신체 근육이 움직인다.","실신은 혈당이 매우 낮거나 대뇌에 전기적 신호 자극 이상이 있을 때 발생한다.","실신한 동안에는 신체 근육의 움직임이 없다.","발작과 실신은 모두 심장의 기능 부전에 의한 임상증상이다.","실신은 의식을 순간적으로 잃는 현상이지만 빠르게 제정신으로 돌아온다."],answers:[1,3],

  mc13:{type:"mc",q:"개에서 발생하는 Myxomatous degenerative mitral valve 질병에 대한 설명으로 틀린 것은?",options:["좌심실의 eccentric hypertrophy에 의해 functional 승모판 역류가 발생한다.","개의 경우는 일반적으로 노령성 질병이다.","승모판이 두껍고 뭉툭하게 변하면서 커진다.","두꺼워진 승모판이 닫힐 때 꺾이면서(prolapsed) 자연스럽게 좌심방으로 역류를 일으키며 시간이 경과하면 울혈성으로 변한다.","승모판 역류에 대한 보상기전으로 좌심실이 eccentric hypertrophy하게 되고 좌심방도 확장하게 된다."],answer:0,

  mc15:{type:"mc",q:"피모벤단(Pimobendan)에 대한 설명으로 옳지 않은 것은?",options:["강력한 양성수축력증강제(Positive inotrope)이다.","말초혈관확장효과도 가지고 있다.","Renin-Angiotensin-Aldosterone System을 차단한다.","혈중의 칼슘의 민감도를 높여준다.","심근의 수축력이 현저히 떨어지는 확장성심근병증에 아주 효과적이다."],answer:2,
    explanation:"피모벤단은 칼슘 감작제 + PDE3 억제제인 inodilator(강심 + 혈관확장)예요. RAAS 차단은 ACE 억제제(enalapril, benazepril)나 spironolactone의 작용이에요."},

    add("최고 기록",b?b.score+" / "+b.total:"아직 없음");
    w.appendChild(f);
    w.appendChild(this.el("p","qnote",s.gen?"Claude가 자동으로 만든 문제예요. 가끔 애매한 보기가 있을 수 있으니 해설이 정리본과 맞는지 확인하며 풀어 보세요."+(s.questions.some(x=>x.type==="short")?" 단답·서술형은 모범답안을 보고 스스로 채점해요.":""):"정답과 해설은 Claude가 정리한 거예요. 교수님 공식 답안이 아니니까 족보 답과 다른 게 있으면 알려주세요. 단답·서술형은 모범답안을 보고 스스로 채점해요."));
    const l=this.el("label","qopt");l.htmlFor="optSQ";const c=document.createElement("input");c.type="checkbox";c.id="optSQ";
    try{c.checked=localStorage.getItem("vetnotes-quiz-sq")==="1"}catch(e){}
    l.append(c,"문제 순서 섞기");w.appendChild(l);
    const a=this.el("div","qactions");
    const go=this.el("button","btn big","1번부터 풀기");go.type="button";
    go.onclick=()=>{this.shuffleQ=c.checked;try{localStorage.setItem("vetnotes-quiz-sq",c.checked?"1":"0")}catch(e){}this.begin([...s.questions.keys()],false)};
    a.appendChild(go);w.appendChild(a);
  },
  begin(idx,retry){this.retry=retry;this.order=this.shuffleQ?this.shuffle(idx):idx.slice();this.i=0;this.log=[];this.show()},
  progress(done){const n=this.order.length;$("qProg").textContent=(this.i+1)+" / "+n;$("qFill").style.width=((this.i+(done?1:0))/n*100)+"%"},
  show(){
    const Qn=this.set.questions[this.order[this.i]],w=this.box();
    this.progress(false);this.keys=null;this.curType=Qn.type;
    const typeName={ox:"O/X",mc:"객관식",multi:"객관식 · 여러 개 고르기",short:"단답·서술형"}[Qn.type];
    w.appendChild(this.el("div","qnum",(this.retry?"다시 풀기 · ":"")+Qn.no+"번 · "+typeName));
    w.appendChild(this.el("p","qtext",Qn.q));
    if(Qn.type==="short")return this.showShort(Qn,w);
    const opts=this.el("div",Qn.type==="ox"?"opts ox":"opts");
    const btns=Qn.options.map((o,k)=>{
      const b=this.el("button","opt");b.type="button";
      b.append(this.el("span","k",CIRC[k]),this.el("span","tx",o));
      opts.appendChild(b);return b;
    });
    w.appendChild(opts);
    if(Qn.type==="multi"){
      w.appendChild(this.el("p","hintline","해당하는 보기를 모두 누른 뒤 ‘제출’을 눌러요."));
      const sel=new Set();
      const a=this.el("div","qactions");const sub=this.el("button","btn big","제출");sub.type="button";sub.disabled=true;a.appendChild(sub);w.appendChild(a);
      btns.forEach((b,k)=>b.onclick=()=>{sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle("sel",sel.has(k));sub.disabled=!sel.size});
      sub.onclick=()=>{a.remove();this.grade(Qn,btns,[...sel].sort(),w)};
      this.keys=k=>{if(btns[k])btns[k].click()};
    }else{
      btns.forEach((b,k)=>b.onclick=()=>this.grade(Qn,btns,[k],w));
      this.keys=k=>{if(btns[k]&&!btns[k].disabled)btns[k].click()};
    }
  },
  grade(Qn,btns,picked,w){
    const right=Qn.type==="multi"?Qn.answers:[Qn.answer];
    const ok=picked.length===right.length&&picked.every(k=>right.includes(k));
    btns.forEach((b,k)=>{
      b.disabled=true;b.classList.remove("sel");
      if(right.includes(k))b.classList.add("right");
      else if(picked.includes(k))b.classList.add("wrong");
      else b.classList.add("dim");
    });
    const fmt=ks=>Qn.type==="ox"?ks.map(k=>Qn.options[k]).join(""):ks.map(k=>CIRC[k]).join(" ");
    this.log.push({q:Qn,ok,mine:fmt(picked),ans:fmt(right)});
    const v=this.el("div","verdict "+(ok?"ok":"no"));
    v.appendChild(this.el("b",null,ok?"정답이에요":"틀렸어요 · 정답 "+fmt(right)));
    if(Qn.explanation)v.appendChild(this.el("p",null,Qn.explanation));
    w.appendChild(v);this.nextBtn(w);
    v.scrollIntoView({block:"nearest",behavior:"smooth"});
  },
  showShort(Qn,w){
    const ta=document.createElement("textarea");ta.className="myans";ta.id="myAns";ta.placeholder="내 답을 적어 보세요 (안 적어도 돼요)";ta.setAttribute("aria-label","내 답");
    w.appendChild(ta);
    const a=this.el("div","qactions");const show=this.el("button","btn big","모범답안 보기");show.type="button";a.appendChild(show);w.appendChild(a);
    show.onclick=()=>{
      a.remove();ta.readOnly=true;
      const v=this.el("div","verdict");
      v.appendChild(this.el("span","lbl","모범답안"));
      v.appendChild(this.el("p",null,Qn.model));
      if(Qn.explanation){v.appendChild(this.el("span","lbl","참고"));v.appendChild(this.el("p",null,Qn.explanation))}
      w.appendChild(v);
      const g=this.el("div","qactions");
      const yes=this.el("button","btn big good","맞혔어요");yes.type="button";
      const no=this.el("button","btn big bad","틀렸어요");no.type="button";
      g.append(yes,no);w.appendChild(g);
      const done=ok=>{this.log.push({q:Qn,ok,mine:ta.value.trim()||"(안 적음)",ans:Qn.model});g.remove();
        const r=this.el("div","verdict "+(ok?"ok":"no"));r.appendChild(this.el("b",null,ok?"맞힘으로 채점했어요":"틀림으로 채점했어요"));w.appendChild(r);this.nextBtn(w)};
      yes.onclick=()=>done(true);no.onclick=()=>done(false);
      v.scrollIntoView({block:"start",behavior:"smooth"});
    };
  },
  nextBtn(w){
    this.keys=null;this.progress(true);
    const last=this.i===this.order.length-1;
    const a=this.el("div","qactions");const n=this.el("button","btn big",last?"결과 보기":"다음 문제");n.type="button";
    n.onclick=()=>{if(last)this.finish();else{this.i++;this.show()}};
    a.appendChild(n);w.appendChild(a);n.focus({preventScroll:true});
  },
  finish(){
    const total=this.log.length,score=this.log.filter(x=>x.ok).length,wrong=this.log.filter(x=>!x.ok);
    $("qProg").textContent="결과";$("qFill").style.width="100%";this.keys=null;
    if(!this.retry){const b=quizBest(this.set.id);if(!b||score>=b.score){try{localStorage.setItem("vetnotes-quiz-best:"+this.set.id,JSON.stringify({score,total}))}catch(e){}}}
    const w=this.box();
    const head=this.el("div","qhead");head.appendChild(this.el("h2",null,this.retry?"틀린 문제 다시 풀기 결과":"결과"));w.appendChild(head);
    const sc=this.el("div","score");sc.append(this.el("span","big",score+" / "+total),this.el("span","pct",Math.round(score/total*100)+"%"));w.appendChild(sc);
    const a=this.el("div","qactions");
    if(wrong.length){const b=this.el("button","btn big","틀린 "+wrong.length+"문제 다시 풀기");b.type="button";
      b.onclick=()=>this.begin(wrong.map(x=>this.set.questions.indexOf(x.q)),true);a.appendChild(b)}
    const again=this.el("button","btn big ghost","처음부터 다시");again.type="button";again.onclick=()=>this.begin([...this.set.questions.keys()],false);a.appendChild(again);
    const back=this.el("button","btn big ghost","목록으로");back.type="button";back.onclick=()=>this.close();a.appendChild(back);
    w.appendChild(a);
    if(wrong.length){
      const rv=this.el("div","review");rv.appendChild(this.el("h3",null,"틀린 문제 다시 보기"));
      for(const x of wrong){
        const c=this.el("div","rv");
        c.appendChild(this.el("div","q",x.q.no+"번. "+x.q.q));
        c.appendChild(this.el("div","mine","내 답: "+x.mine));
        c.appendChild(this.el("div","ans","정답: "+x.ans));
        if(x.q.explanation)c.appendChild(this.el("div","ex",x.q.explanation));
        rv.appendChild(c);
      }
      w.appendChild(rv);
    }else w.appendChild(this.el("p",null,"전부 맞혔어요."));
  }
};

/* ===================== 저장해 둔 자동 생성 문제 (data/quizzes.json) ===================== */
let genSets=[],quizLoaded=false;
function allQuizSets(){return [...genSets,...QUIZ_SETS]}
fetch("data/quizzes.json").then(r=>r.ok?r.json():[]).then(a=>{
  genSets=(Array.isArray(a)?a:[]).filter(x=>x&&Array.isArray(x.questions)&&x.questions.length&&catOf(x.category)).map(x=>Object.assign({gen:true},x));
}).catch(()=>{}).finally(()=>{quizLoaded=true;if(mode==="quiz")render()});
$("qBack").onclick=()=>Quiz.close();
document.addEventListener("keydown",e=>{
  if($("quiz").hidden)return;
  if(e.key==="Escape"){Quiz.close();return}
  if(e.target&&(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT"))return;
  if(/^[1-8]$/.test(e.key)&&Quiz.keys){e.preventDefault();Quiz.keys(+e.key-1)}
  else if(Quiz.curType==="ox"&&Quiz.keys&&/^[oOxX]$/.test(e.key))Quiz.keys(/[oO]/.test(e.key)?0:1);
});
try{if(localStorage.getItem("vetnotes-mode")==="quiz")setMode("quiz")}catch(e){}
render();load(false);
</script>
