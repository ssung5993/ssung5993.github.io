<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산과 2025-2 중간고사 기출 풀이</title>
<style>
@font-face{font-family:'GmarketSans';font-weight:500;
 src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-display:swap}
@font-face{font-family:'GmarketSans';font-weight:700;
 src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-display:swap}
@font-face{font-family:'GmarketSans';font-weight:300;
 src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff');font-display:swap}
:root{--ink:#1B2A44;--blue:#2B5FC4;--red:#E23B3B;--sp:#1F6F5C;--teal:#13756A;
 --teal-l:#D8ECE7;--cream:#FFF6D8;--grey:#6C7787;--line:#dfe4ea;--ok:#0F9268;--ok-l:#E3F5EE;--no-l:#FDECEC}
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;color:var(--ink);
 font-family:'GmarketSans','맑은 고딕',sans-serif;font-weight:500;font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 70px}
header{background:linear-gradient(135deg,#123c57,#13756A);color:#fff;padding:22px 0 18px}
header .wrap{padding-bottom:0}
h1{font-weight:700;font-size:22px;margin:0 0 4px}
h1 span{font-weight:300;font-size:13.5px;opacity:.85;margin-left:4px;display:inline-block}
.lead{font-weight:300;font-size:12.8px;opacity:.92;margin:0}
.bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(20,40,60,.05)}
.bar .wrap{padding:9px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.score{font-weight:700;font-size:13.5px;margin-right:auto}
.score .s1{color:var(--ok)}.score .s2{color:var(--red)}
.score small{font-weight:500;color:var(--grey);font-size:12px;margin-left:4px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:12.4px;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.reset{color:var(--grey)}
.jump{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.jump a{font-size:12.6px;color:var(--teal);text-decoration:none;border-bottom:1px solid currentColor}
h2.part{font-weight:700;font-size:17px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.part .no{background:var(--teal);color:#fff;border-radius:6px;font-size:12px;padding:2px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 16px 14px;margin-bottom:12px;scroll-margin-top:60px}
.card.ok{border-left:4px solid var(--ok)}.card.no{border-left:4px solid var(--red)}
.qh{display:flex;gap:8px;align-items:flex-start}
.qn{flex:none;background:var(--ink);color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:2px 7px;margin-top:2px}
.qt{font-weight:700;font-size:15px;line-height:1.55}
.qt u{text-underline-offset:3px}
.fig{margin:10px 0 2px;text-align:center}
.fig img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.fig.two{display:flex;gap:8px}.fig.two>div{flex:1;min-width:0}
.fig.two b{display:block;font-size:12.5px;margin-bottom:3px}
.boxq{border:1px solid #9aa6b5;border-radius:6px;padding:8px 12px;margin:10px 0 2px;font-size:13.4px;background:#fbfcfd}
.boxq ul{margin:0;padding-left:16px}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.opt{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:#fff;color:var(--ink);
 border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:#a9b8c8}
.opt .c{flex:none;font-weight:700;color:var(--teal);min-width:18px}
.opt.sel{border-color:var(--blue);background:#F4F9FF}
.opt.correct{border-color:var(--ok);background:var(--ok-l)}
.opt.correct .c{color:var(--ok)}
.opt.wrong{border-color:var(--red);background:var(--no-l)}
.opt.wrong .c{color:var(--red)}
.opt .mk{margin-left:auto;font-weight:700;flex:none;padding-left:6px}
.opt.correct .mk::after{content:'정답';color:var(--ok);font-size:12px}
.opt.wrong .mk::after{content:'내 답';color:var(--red);font-size:12px}
.opt:disabled{cursor:default}
.opt.imgopt{flex-direction:column;align-items:stretch;padding:7px}
.opt.imgopt img{width:100%;height:auto;border-radius:4px;display:block}
.opt.imgopt .row{display:flex;align-items:center}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;background:var(--teal);color:#fff;font:inherit;font-weight:700;font-size:13.4px;border-radius:7px;padding:8px 14px;cursor:pointer}
.btn:disabled{background:#b9c6cf;cursor:default}
.btn.ghost{background:#fff;color:var(--grey);border:1px solid var(--line);font-weight:500}
.btn.alt{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.hint{font-size:12.4px;color:var(--grey)}
.res{margin-top:11px;border-radius:8px;padding:11px 13px;font-size:13.4px;display:none}
.res.show{display:block}
.res.ok{background:#F2FAF6;border:2px solid var(--ok)}
.res.no{background:#FFF8F8;border:2px solid var(--red)}
.res .rt{font-weight:700;font-size:14px;margin-bottom:5px}
.res.ok .rt{color:var(--ok)}.res.no .rt{color:var(--red)}
.res ul{margin:4px 0 0;padding-left:17px}
.res li{margin:1px 0}
.res .why{margin:2px 0 4px}
.src{display:inline-block;margin-top:8px;font-size:11.8px;color:#12403b;background:var(--teal-l);border-radius:5px;padding:2px 8px}
.src.ext{background:#EEF0F3;color:var(--grey)}
.warn{font-size:12.4px;color:#8a5a00;background:#FFF6D8;border-radius:5px;padding:5px 9px;margin-top:7px}
.sa{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.sa label{display:flex;gap:8px;align-items:center;font-size:13.4px}
.sa label b{flex:none;min-width:58px}
.sa input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;font-size:14.5px;color:var(--ink)}
.sa input:focus{outline:none;border-color:var(--blue)}
.sa input.good{border-color:var(--ok);background:var(--ok-l)}
.sa input.bad{border-color:var(--red);background:var(--no-l)}
b{font-weight:700}
.r{color:var(--red);font-weight:700}
.g{color:var(--grey);font-size:12.4px}
.sp{font-family:'Times New Roman',serif;font-style:italic;color:var(--sp);font-size:1.05em}
.hl{background:linear-gradient(transparent 55%,rgba(255,226,72,.85) 55%)}
.ansline{font-weight:700;color:var(--ink);font-size:14px;margin:2px 0 4px}
.ansline em{font-style:normal;color:var(--red)}
body.f-undone .card.ok,body.f-undone .card.no{display:none}
body.f-wrong .card:not(.no){display:none}
body.f-wrong h2.part,body.f-undone h2.part{margin-top:12px}
.empty{display:none;text-align:center;color:var(--grey);padding:30px 0;font-size:13.4px}
footer{text-align:center;color:var(--grey);font-size:12px;padding:18px 0 0}
@media print{.bar,.actions,.jump{display:none}.res{display:block!important}.card{page-break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>수의산과학 중간고사 <span>2025년 2학기 · 기출 풀이</span></h1>
<p class="lead">객관식 30 + 주관식 8 — 답을 고르면 정답과 해설이 떠요. 해설 아래 태그는 정리본(6-1 ~ 7-2)에서 근거를 찾은 위치예요.</p>
</div></header>

<div class="bar"><div class="wrap">
<div class="score" id="score"></div>
<button class="chip on" data-f="all">전체</button>
<button class="chip" data-f="undone">안 푼 것</button>
<button class="chip" data-f="wrong">틀린 것</button>
<button class="chip reset" id="reset">초기화</button>
</div></div>

<div class="wrap">
<div class="jump"><a href="#mc">객관식 1–30</a><a href="#sa">주관식 1–8</a></div>
<h2 class="part" id="mc"><span class="no">I</span> 객관식</h2>
<div id="mcList"></div>
<h2 class="part" id="sa"><span class="no">II</span> 주관식</h2>
<div id="saList"></div>
<div class="empty" id="empty">해당하는 문제가 없어요.</div>
<footer>수의산과학 2025-2 중간고사 · 정답·해설은 산과 6-1 ~ 7-2 컴팩트 정리본 기준</footer>
</div>

<li>① 브루셀라 — 예방: <b>19주 백신 / 살처분</b>, 유산태아·태반은 매몰·소각</li>
<li>⑤ 결핵 — 정기 <b>투베르쿨린 피내반응</b> 검사, 감염 동물 <b>도태(살처분)</b></li>
<li>② 렙토 · ④ 리스테리아 — 대량 항생물질 치료 대상 / ③ 캠필로박터 — 인공수정으로 관리</li></ul>`,
 s:'6-1 · 1. 세균성 ① 브루셀라 · ⑤ 결핵'},
{n:2,q:'소의 세균성 유산에 대한 설명 중 <u>옳지 않은</u> 것은?',
 o:['브루셀라는 임신 6~9개월 임신우의 유산을 일으킨다.','브루셀라는 탐식세포 내에 latent infection을 유발해 근절이 어렵다.','렙토스피라병에 의한 유산에서는 광범위한 petechia가 보이고, 헤모글로빈뇨가 관찰된다.','캠필로박터는 교미를 통해 감염되는 venereal disease가 아니다.','결핵은 투베르쿨린 검사를 통한 정기적인 모니터링이 필요하다.'],a:[4],
 e:`<p class="why">${S('C. fetus <b>venerealis</b>')}는 이름 그대로 <b>교미로 전파되는 생식기병(venereal disease)</b>이에요.</p><ul>
<li>① 브루셀라 유산 = 임신 마지막 3개월(보통 <b>6~9개월</b>) ✓</li>
<li>② Latent infection(<b>탐식세포 내</b>) → 근절 어려움 ✓</li>
<li>③ 부검 시 <b>광범위한 점상출혈(petechia)</b>, 중증에서 <b>헤모글로빈뇨</b> ✓</li>
<li>⑤ 정기적 투베르쿨린 피내반응 ✓</li></ul>`,
 s:'6-1 · 1. 세균성 ①②③⑤'},
{n:3,q:'소에서 유산을 유발하는 비세균성 감염원에 대한 설명으로 <u>옳지 않은</u> 것은?',
 o:['트리코모나스증은 불임증과 조기태아사를 특징으로 하는 생식기 질병이다.','오제스키병은 선천적 기형 및 대뇌 결손 등을 수반하는 송아지를 분만한다.','소바이러스성설사증-점막병은 예방접종 시 영구 면역을 획득하나 임신 중 예방접종은 금지된다.','아카바네병은 Bunyaviridae arbovirus에 의한 병이고, 모기에 의해 매개된다.','네오스포라증은 '+S('Neospora caninum')+'에 의해 유산이 일어나며 유산태아는 혈액 장액성의 포도주 색을 보인다.'],a:[2],
 e:`<p class="why"><b>선천 기형·대뇌결손 송아지 = 아카바네병</b>이에요. 오제스키병(가성광견병)은 정리본에 '소의 유산'으로만 나와요.</p><ul>
<li>① 트리코모나스 = 생식기병, <b>불임증과 조기 태아사</b> ✓</li>
<li>③ BVD-MD = 예방접종 시 <b>영구 면역</b>, <b>임신 중 접종 금지</b> ✓</li>
<li>④ 아카바네 = Bunyaviridae arbovirus, 빨간집모기·숲모기·겨모기 ✓</li>
<li>⑤ 네오스포라 = 6개월령 넘는 유산태아는 <b>포도주색(혈액 장액성)</b> ✓</li></ul>`,
 s:'6-1 · 2. 바이러스성 ③④⑥ / 3. 원충성'},
{n:4,q:'암소에서 다음 그림에 해당하는 감염병 원인체는 무엇인가?',img:'q4',
 o:[S('Trichomonas fetus'),S('Campylobacter jejuni'),S('Brucella abortus'),S('Mycobacterium avium'),S('Corynebacterium fetus')],a:[1],
 e:`<p class="why">그림은 <b>여러 가닥의 편모 + 파동막</b>을 가진 단세포 <b>원충</b> — 트리코모나스(${S('Tritrichomonas foetus')})예요. 나머지 보기는 전부 세균이라 이런 모양이 안 나와요.</p><ul>
<li>트리코모나스병 = <b>생식기병</b>, 특징 <b>불임증과 조기 태아사</b>, 유산은 임신 초기 3개월 전~4개월 말</li></ul>`,
 s:'6-1 · 3. 원충성 ① 트리코모나스'},
{n:5,q:'말의 유산에 대한 설명 중 <u>옳지 않은</u> 것은?',
 o:['말의 유산 발생률은 소보다 높아서 10~15%이다.','렙토스피라병에 의해 임신 7~11개월의 암말 유산이 발생한다.','말 헤르페스 I형 및 동맥염 바이러스는 유산을 유발한다.','말의 연쇄상구균성 유산은 '+S('Streptococcus thermophilus')+'에 의해서 발생한다.','쌍태 임신은 말 유산의 일반적인 원인이다.'],a:[4],
 e:`<p class="why">말 연쇄상구균성 유산의 원인균은 ${S('Str. genitalium')}, ${S('Str. zooepidemicus')}예요. ${S('S. thermophilus')}는 요구르트 발효균이에요.</p><ul>
<li>① 말 유산 발생률 <b>10~15%</b>(소보다 높음) ✓</li>
<li>② 렙토스피라 유산 <b>7~11개월</b> ✓</li>
<li>③ EHV-1(8~11개월), EVA(5~10개월, 감염마 50% 유산) ✓</li>
<li>⑤ <b>쌍태 임신 = 말 유산의 일반적 원인</b> ✓</li></ul>`,
 s:'6-2 · 1. 말의 유산'},
{n:6,q:'돼지와 양의 유산에 대한 설명 중 <u>옳지 않은</u> 것은?',
 o:['양의 야토병은 임신말기에 유산을 유발한다.','돼지의 렙토스피라병은 오줌, 오염된 사료나 물에 의해 전파된다.','양의 유행성 유산은 조기유산이 가장 많다.','돼지의 부르셀라병은 소에 비해 잠행성이다.','양에서 셀레늄 결핍은 유산 또는 신생아사를 일으키며 백근병을 동반한다.'],a:[3],
 e:`<p class="why">양 유행성 유산(EAE, ${S('Chlamydophila abortus')})은 <b>임신 100일~말기</b>에 유산돼요 — 조기유산이 아니에요.</p><ul>
<li>① 야토병균·가성결핵균 = <b>임신 말기</b> 암양 유산 ✓</li>
<li>② 돼지 렙토 = <b>오줌(직접)</b>, 오염 사료·물(간접) ✓</li>
<li>④ ${S('B. suis')} = 소보다 <b>잠행성(insidious)</b> ✓</li>
<li>⑤ 셀레늄 결핍 = 유산·신생아사, <b>선천성 백근병</b> ✓</li></ul>`,
 s:'6-2 · 2. 돼지 / 3. 양 바이러스성 ①'},
{n:7,q:'개 유산에 대한 설명으로 <u>옳지 않은</u> 것은?',
 o:['중대동물에 비해서 유산이 적다.','브루셀라는 개 유산의 가장 일반적인 원인이고 백신이 없어서 안락사가 권고된다.','대장균, 포도상구균, 연쇄상구균 등에 의해서도 산발성 유산이 일어난다.','진균에 의한 개 유산이 자주 발생한다.','개는 estrogen의 독성에 매우 민감하고, progesterone이 부족할 경우 유산이 발생할 수 있다.'],a:[4],
 e:`<p class="why">개·고양이의 <b>진균성 유산은 아직 보고 없음</b>이에요.</p><ul>
<li>① 대동물·중동물에 비해 <b>유산이 적음</b> ✓</li>
<li>② ${S('B. canis')} = 가장 일반적 원인, <b>백신 없음</b>, 안락사 권고 ✓</li>
<li>③ 대장균류·포도상구균·연쇄상구균 → 노령 암캐 산발성 유산 ✓</li>
<li>⑤ estrogen 독성에 매우 민감(골수 위축 등), <b>P4 결핍 → 유산</b> ✓</li></ul>`,
 s:'6-2 · 4. 개 및 고양이의 유산'},
{n:8,q:'세 살 된 리트리버 암컷이 우발적인 교배로 원하지 않는 임신이 되었다. 하루 전에 교배하였을 경우 적절한 수태방지법은?',
 o:['지속성 diethylstilbestrol을 근육주사한다.','자극성이 없는 소독제로 생식기를 세척한다.','Progesterone을 처치한다.','200 IU의 oxytocin을 피하주사한다.','100 IU의 hCG를 근육주사한다.'],a:[1],
 e:`<p class="why">수태방지는 <b>교배 후 24~48시간 이내 estrogen</b>. 개는 <b>지속성 diethylstilbestrol 근육주사(2 mg/kg)</b> 후 5~7일간 0.5~0.7 mg 경구예요.</p><ul>
<li>② 생식기 세척 — 대부분 <b>수태를 방지할 수 없음</b></li>
<li>③ P4 — <b>교배 후엔 방지 효과 없고 오히려 임신 유지</b></li>
<li>④ 옥시토신 — 소에서 발정 후 2~7일(실험적)</li>
<li>⑤ hCG — 황체 발육 촉진 → P4↑ → 오히려 임신 유지 쪽</li></ul>`,
 s:'6-2 · 6. 수태방지법 1)~4)'},
{n:9,q:'인공유산에 대한 설명 중 <u>옳지 않은</u> 것은?',
 o:['소와 말의 경우 교배 후 7~20일에 소독제를 이용한 자궁관주법으로 유산을 유발할 수 있다.','Estrogen의 대량 또는 반복 투여는 소의 임신 중 어느 시기에서도 반드시 유산을 일으킨다.','최근 소의 인공유산에 PGF2α가 주로 응용되고 있다.','소의 양막낭을 인공적으로 파열하여 유산을 유발한다.','대량의 glucocorticoids를 활용한 소의 유산 방법은 임신 초기에 효과적이다.'],a:[5],
 e:`<p class="why">Glucocorticoid 유산은 <b>임신 후기</b>에 써요(말은 4~5개월). 소는 estrogen과 병용하면 효과적이에요.</p><ul>
<li>① 자궁 관주법 = 소·말, 교배 후 <b>7~20일</b> ✓</li>
<li>② estrogen 대량·반복 = <b>어느 시기든 반드시 유산</b> ✓</li>
<li>③ PGF2α = 소 인공유산(25~50 mg) ✓</li>
<li>④ 소 <b>양막낭</b> 파열(30~50일) ✓</li></ul>`,
 s:'6-2 · 6. 유산의 유발 1)~5)'},
{n:10,q:'소에서 요막수종과 양막수종을 비교한 것으로 <u>옳은</u> 것은?',
 o:['양막수종이 더 흔하다.','양막수종일 때 복부팽만이 더 빠르다.','양막수종일 때 자궁염이 더 흔히 발생한다.','요막수종의 번식관련 예후가 더 양호하다.','양막수종일 때 선천적 태아 기형이 발생하고, 요막수종일 때 자궁질환이 잘 발생한다.'],a:[5],
 e:`<p class="why">양막수종 = <b>태아측 원인(기형 태아)</b>, 요막수종 = <b>자궁 질환 동반</b>(부태반, 궁부 감소).</p><ul>
<li>① ✗ 요막수종이 <b>85~90%</b>, 양막수종은 5~10%</li>
<li>② ✗ 요막수종이 <b>5~20일 이내 급속</b>, 양막은 서서히</li>
<li>③ ✗ 요막수종에서 <b>태반정체·심한 자궁염</b></li>
<li>④ ✗ 예후 양호는 <b>양막수종</b>, 요막은 불량~주의</li></ul>`,
 s:'6-3 · IV-1 표 6-1 감별 진단'},
{n:11,q:'다음은 어떤 임신 중 폐사한 태아의 변화에 대한 설명인가?',
 box:['임신 중기나 마지막 3분의 1 기간에 폐사되었지만 임신황체가 유지되고, 7~10일간 유산되지 않음.','태아의 자가융해와 태아흡수가 일어나고 모체태반은 퇴축됨.','폐사태아는 보통 갈색이고 태아 조직은 딱딱하게 굳음.'],
 o:['태아 미라 변성','자궁축농증','태아침지','기종태','반전성열체'],a:[1],
 e:`<p class="why">임신 중기~마지막 1/3 폐사 + <b>임신황체 존재 → 7~10일 유산 안 됨</b> → 자가융해·태수 흡수·모체태반 퇴축 = <b>미라변성</b>.</p><ul>
<li>갈색·태반출혈 없음 = <b>종이모양형</b>(돼지 등) / 소는 적갈색 응괴의 <b>출혈성형</b></li>
<li>소: 태아 조직 건조 → <b>굳은 가죽</b></li></ul>`,
 s:'6-3 · IV-2 1) 태아 미라변성'},
{n:12,q:'죽은 태아가 자궁 내에서 부패균의 작용에 의하지 않고 연조직이 융해되어 농후 크림양 액과 골격이 남아있는 상태를 무엇이라고 하는가?',
 o:['태아 미라 변성','자궁축농증','태아침지','기종태','반전성열체'],a:[3],
 e:`<p class="why">연조직은 녹고 <b>뼈만 자궁 내 농에 떠 있는 것 = 태아침지(maceration)</b>. 골이 발육된 <b>3개월 이후</b>에 생겨요.</p><ul>
<li>④ 기종태 = <b>부패균</b> → 피하·내장 가스, 염발음(crepitus)</li>
<li>① 미라변성 = 융해·침지 없이 <b>건조·경화</b></li>
<li>⑤ 반전성열체 = 양막수종을 일으키는 기형 태아</li></ul>`,
 s:'6-3 · IV-2 2) 태아침지 및 기종태'},
{n:13,q:'자궁염전에 대한 설명 중 <u>옳지 않은</u> 것은?',
 o:['자궁이 장축에 따라 회전 또는 염전되는 것을 말한다.','45도 이상 염전에서 예후가 불량하다.','자궁염전은 보통 임신 후기에 관찰된다.','젖소에서 가장 많이 발생하며, 돼지에서는 드물다.','치료는 모체 회전법, 수술적 교정이 있다.'],a:[2],
 e:`<p class="why"><b>45~90°는 자연 회복</b>, 90° 이하는 치료 필요 없고 예후 양호예요. 심각한 건 180° 이상.</p><ul>
<li>① 자궁의 <b>장축</b>에 따른 회전 ✓</li>
<li>③ 보통 임신 후기(소: 70일~만기) ✓</li>
<li>④ <b>젖소</b>에서 가장 많이 발생 ✓</li>
<li>⑤ <b>Schaffer's method</b>(모체 회전), 개복수술 ✓</li></ul>`,
 s:'6-3 · V-3 자궁꼬임'},
{n:14,q:'소에서 분만 2~3개월 전에 발생하는 질탈의 원인으로 <u>옳은</u> 것은?',
 o:['임신자궁뿔과 비임신자궁뿔 간의 크기 비대칭','임신 황체에서 progesterone의 과분비','태반에서 estrogen의 과분비','질과 자궁목의 강한 수축','태막 내 태수 과다'],a:[3],
 e:`<p class="why">소 질탈 = <b>분만 2~3개월 전 태반에서 분비되는 대량 estrogen</b> → 골반인대·음문 부종·이완.</p><ul>
<li>① 임각·불임각 비대칭 = <b>자궁꼬임</b>의 원인</li>
<li>② P4는 오히려 질탈 <b>치료제</b>(10일 간격 근육주사)</li>
<li>⑤ 태수 과다 = 태막 수종</li></ul>`,
 s:'6-3 · V-4 질탈 원인'},
{n:15,q:'질탈은 일반적으로 질의 저부, 측벽 및 상벽의 일부가 음문으로 탈출되는 것을 말한다. 다양한 질탈에 적용 가능한 다음의 방법의 명칭을 고르시오.',img:'q15',
 o:['음부압정대','페서리법','음문 봉합법','뷰너 봉합법','캐슬릭법'],a:[4],
 e:`<p class="why">음문 둘레 <b>피하층에 테이프를 돌려 넣고 아래에서 매듭</b> = <b>Bühner(뷰너)법</b>, 쌈지봉합(purse-string). <b>분만 전·후 만성 질탈 모두</b>에 써요 → 문제의 "다양한 질탈에 적용 가능".</p><ul>
<li>① 음부압정대 = 외부에 장착하는 기구 / ② 페서리 = 질 안에 넣는 물체</li>
<li>③ 음문 봉합법 = 분만 전 약 2~3주 / ⑤ Caslick = 음문폐쇄법의 원형(말)</li></ul>`,
 s:'6-3 · V-4 질탈 치료법 ⑧'},
{n:16,q:'소에게 배반포(Blastocyst) 수정란을 2025년 10월 30일에 이식하였다. 정상 분만 예정일은?',
 o:['2026년 6월 15일','2026년 6월 30일','2026년 7월 30일','2026년 8월 25일','2026년 10월 30일'],a:[3],
 e:`<p class="why">함정은 <b>이식일 ≠ 수정일</b>이라는 점이에요.</p><ul>
<li>배반포 = 수정 후 약 <b>7일</b> 된 배아 → 수정일로 환산하면 약 <b>10월 23일</b></li>
<li>소 분만예정일 공식: <b>수정월 −3, 수정일 +6~11</b> → 7월 29일 ~ 8월 3일</li>
<li>보기 중 이 범위에 드는 건 <b>7월 30일</b> (소 임신기간 283일과도 맞음)</li></ul>`,
 s:'7-1 · II-4 기타 참고사항 / 6-2 · 0. 임신기간',warn:'정리본엔 "배반포 = 수정 후 7일"이 따로 적혀 있지 않아서, 그 부분은 발생학 일반 지식으로 보충했어요.'},
{n:17,q:'다음 중 분만에 대한 설명으로 <u>옳지 않은</u> 것은?',
 o:['골반강의 모양이 개와 말에서는 원형에 가깝고, 소와 돼지는 장원형에 가깝다.','태아발육에 따른 자궁 및 자궁경관의 자극에 의해 분만이 시작된다.','소는 분만 24~48시간 전에 평소 체온보다 1~1.5℃ 하강한다.','개는 분만 10~24시간 전에 0.5~1℃ 가량 갑자기 하강한다.','암퇘지에서 모성적인 행동은 뇌하수체후엽에서 나오는 prolactin의 작용이다.'],a:[5],
 e:`<p class="why">prolactin은 <b>뇌하수체 전엽</b> 호르몬이에요(후엽은 oxytocin·vasopressin).</p><ul>
<li>① 소·돼지 = 타원형(장원형), 말·개 = 원형 ✓</li>
<li>② 분만개시 기전 중 하나 ✓</li>
<li>③ 소 24~48h 전 1~1.5℃ ✓ / ④ 개 10~24h 전 0.5~1℃ ✓</li></ul>`,
 s:'7-1 · 0. 개요 / II-2 동물별 표 / III-2 골반강'},
{n:18,q:'분만에 대한 설명으로 <u>옳지 않은</u> 것은?',
 o:['분만 3기 중 가장 짧게 소요되는 시기는 태아 만출기이다.','분만 시 산도 통과에서 가장 곤란한 부분은 태아의 두부, 흉부, 요부이다.','개구기는 규칙적인 개구 진통의 반복으로 자궁경관이 완전히 확장되어 질과 경계없이 이행될 때까지 기간이다.','출산기에는 요막융모막이 파열되는 제2파수가 일어난다.','분만 2기가 소나 말에서 6시간 이상 지속되면 태위의 이상 또는 자궁염전을 암시한다.'],a:[4],
 e:`<p class="why">요막융모막(암적색 태포) 파열은 <b>제1파수</b>(개구기 후반)예요. 출산기의 <b>제2파수 = 양막낭</b>(황백색, 발굽이 음문 통과할 때).</p><ul>
<li>① 소: 1기 2~6h, <b>2기 30분~3·4h</b>, 3기 3~8h → 2기가 가장 짧음 ✓</li>
<li>② 머리·가슴·허리 ✓ / ③ 개구기 정의 ✓ / ⑤ 6시간 이상 ✓</li></ul>`,
 s:'7-1 · IV. 분만의 경과 1~3'},
{n:19,q:'분만 전후의 소 혈청 호르몬의 변화를 나타낸 그래프이다. (A)와 (B)에 호르몬이 올바르게 짝지어진 것은?',img:'q19',
 o:['LH – FSH','Relaxin – PGF2α','Oxytocin – Estrogen','Gonadotropin – Cortisone','Estradiol – Progesterone'],a:[5],
 e:`<ul>
<li><b>(A) 분홍 점선</b>: 분만 직전까지 치솟다가 분만 직후 급락 = <b>Estradiol</b> (소 임신 후기 estrogen 2~3.5배↑)</li>
<li><b>(B) 초록 점선</b>: 분만 전 높게 유지되다 분만 직전 거의 0으로 급락 = <b>Progesterone</b> (분만 개시 = P4↓)</li>
<li>보라 실선 = Glucocorticoid — 태아 corticoid↑ → estrogen↑·PGF2α↑ → 황체 퇴행</li></ul>`,
 s:'7-1 · III-1 임신 말기 혈중 호르몬'},
{n:20,q:'신생동물의 질병과 간호에 대한 설명 중 <u>옳지 않은</u> 것은?',
 o:['부드러운 짚이나 수건으로 등 부위를 문지르면 신생동물의 호흡 기능이 촉진된다.','출산이 청결한 장소에서 이루어졌다면 일반적으로 탯줄의 소독은 필요 없다.','임신한 동물에서 새끼에게 면역의 태반이행은 대부분 가축에서 관찰된다.','신생동물에 태반정체가 발생되면 생리식염수 비눗물에 글리세롤을 혼합해서 관장한다.','신생동물의 요색잔존증을 치료하기 위해 항생제 투여와 배쪽의 국소 치료가 병행되어야 한다.'],a:[3],
 e:`<p class="why">면역물질 태반이행은 <b>개·고양이에서 약간</b>, 다른 가축은 일어나지 않아요 → 그래서 초유 IgG가 중요.</p><ul>
<li>① 짚·수건으로 등·머리·콧구멍 마찰 → 호흡 촉진 ✓</li>
<li>② 탯줄 소독 <b>일반적으로 불필요</b> ✓</li>
<li>④ 문맥상 '태<b>변</b>정체' 오타로 보여요 — 태변정체(수컷 망아지) 치료 = <b>관장</b> ✓</li>
<li>⑤ 요색잔존증 = 요막관잔존 → 항생제 + 국소 치료 ✓</li></ul>`,
 s:'7-2 · 6. 신생동물 1)2) / 4)~9) 표 ★수업'},
{n:21,q:'다음 중 정상이지만 도움이 필요할 수도 있는 태아의 자세는?',imgopts:true,
 o:['q21_1','q21_2','q21_3','q21_4','q21_5'],a:[1],
 e:`<p class="why">① = <b>미위종위상태향</b>: 뒷다리부터 산도로, 등은 모체 천골(위) 쪽. 단태동물의 정상 태위지만 <b>분만보조가 필요</b>할 수 있어요(소 미위 = 질식사 위험).</p><ul>
<li>② 두위종위상태향 — 머리와 앞다리가 산도 쪽 = <b>정상, 자연분만</b></li>
<li>③ 엉덩이가 산도 쪽, 뒷다리는 몸 아래로 접힘 = <b>둔위(breech)</b> → 난산</li>
<li>④ · ⑤ 산도로 진입하지 못한 이상 자세(태향·태세 이상) → 난산</li></ul>`,
 s:'7-1 · III-3·4 태위·태향·태세'},
{n:22,q:'신생동물의 질병과 간호에 대한 설명 중 <u>옳지 않은</u> 것은?',
 o:['말에서 특히 요막융모막이 비경부 주위를 덮어 질식 우려가 높다.','돼지에서는 폐사된 태아가 있을 경우 만출이 지연될 수 있다.','초유 내 함유된 IgG 항체 등 면역물질을 통한 전신수동면역이 중요하다.','태변은 수컷 망아지에서 다발하고, 관장이 권장된다.','자궁을 통한 신생동물의 감염은 산업동물에서 드물게 발생한다.'],a:[1],
 e:`<p class="why">말에서 비경부를 덮어 질식시키는 건 <b>양막</b>이에요 → 조산자가 제거.</p><ul>
<li>② 돼지: 폐사 태아 있으면 만출 지연 ✓</li>
<li>③ 초유 IgG → 전신 수동면역 ✓ / ④ 태변정체 = 수컷 망아지, 관장 ✓</li>
<li>⑤ 자궁 내 감염은 분만 후 감염보다 <b>드묾</b> ✓</li></ul>`,
 s:'7-2 · 6. 신생동물 ★수업 / 7-1 · IV 돼지'},
{n:23,q:'태아의 호흡개시 기전에 대한 설명으로 <u>옳지 않은</u> 것은?',
 o:['개시는 심호흡 후에 일어난다.','태아 혈액 내 산소의 증가, 태아혈관의 압력이 증가하면서 일어난다.','폐혈관이 확장되면서 폐혈관 저항 감소에 기인한다.','좌심방 혈류가 증가하면서 혈압 상승에 의한다.','좌심방에서 유입되는 혈액량과 압력의 증가와 폐호흡 개시 등에 의해 태아 순환계에 있었던 우회 순환로가 닫힌다.'],a:[2],
 e:`<p class="why">호흡을 유발하는 건 혈중 <b>CO₂ 증가</b>예요(산소 증가 ✗). 탯줄이 끊기면 가스교환이 멈춰 CO₂가 쌓이죠.</p><ul>
<li>① 만출 후 심호흡 ✓ / ③ 폐혈관 확장 → 저항 감소 ✓</li>
<li>④ 좌심방 혈류↑ → 혈압 상승 ✓ / ⑤ 우회로 폐쇄 ✓</li></ul>`,
 s:'7-2 · 6. 신생동물 (호흡 개시)'},
{n:24,q:'태반정체에 대한 설명으로 <u>옳지 않은</u> 것은?',
 o:['분만 후 소 8~12시간, 말 3~6시간, 양 8~12시간 이내 태막이 배출되지 않는 경우를 말한다.','태반 제거 전에 세척하고 항생제를 사용한다.','정체된 태반을 조심스럽게 잡아당겨서 제거해준다.','소에서 태반 정체 시 자궁경관의 퇴축이 20~30일까지 지연될 수 있다.','소에서 에스트로겐을 다량 투여하면 부작용으로 태반정체가 발생할 수 있다.'],a:[3],
 e:`<p class="why">붙어 있는 태반을 당겨서 떼면 자궁소구·내막 손상, <b>출혈·감염</b> 위험 → 무리한 견인은 하지 않아요.</p><ul>
<li>① 소·양 8~12h, 말 3~6h ✓</li>
<li>④ 태반정체 시 경관 퇴축 <b>20~30일 지연</b> ✓</li>
<li>⑤ estrogen 대량 투여 부작용(임신 중·후기) — 태반정체 ✓</li></ul>`,
 s:'7-2 · 7·8 태반정체 기준 / V-1 소 / 6-2 · 6. 에스트로겐',warn:'③ "당겨서 제거하면 안 된다"와 ② 세척·항생제는 정리본에 직접 없는 내용이라 일반 임상 원칙으로 판단했어요.'},
{n:25,q:'소가 분만 후 24시간 내에 일어나지 못하고 귀가 차갑고 경련을 일으킨다. 어떤 처치가 가장 적합한가?',
 o:['PGF2α 투여','GnRH 주사','칼슘 정맥 투여','항생제 경구 투여','옥시토신 근육 주사'],a:[3],
 e:`<p class="why">분만 직후 기립불능 + 귀(말단) 냉감 + 경련 = <b>유열(milk fever) = 저칼슘혈증</b> → <b>칼슘제 정맥 투여</b>.</p><ul>
<li>정리본: 분만전 유열 = 유량 많은 소, <b>낮은 혈중 칼슘</b> / 그라스 테타니 치료 = 칼슘제(+Mg)</li></ul>`,
 s:'6-3 · V-5 임신기 마비 3)·4)'},
{n:26,q:'다음 중 번식 장애와 가장 관계가 깊은 비타민은?',
 o:['비타민 K','비타민 B','비타민 C','비타민 D','비타민 E'],a:[5],
 e:`<p class="why">비타민 E(tocopherol)는 '항불임 비타민'으로 불려요. 결핍 시 번식장애, 셀레늄과 함께 <b>백근병</b>과 연관돼요.</p><ul>
<li>정리본엔 비타민 A(유산·태반정체)와 셀레늄(백근병)만 있고 A는 보기에 없어요 → 보기 중에선 E</li></ul>`,
 s:'정리본 외 — 일반 지식',ext:true},
{n:27,q:'돼지의 분만 준비로 <u>옳지 않은</u> 것은?',
 o:['분만장소는 분만과 동시에 신생자돈을 포유할 수 있는 장소로 모체가 안정감을 느낄 수 있는 장소에 준비해둔다.','신생산자의 체온유지를 위해 가온 전구를 설치한다.','분만 후 분만 산물인 태반이나 삼출물 등을 제거하기 쉽도록 한다.','부주의한 모체에 의해 산자의 압사를 방지할 수 있는 분만용 틀을 설치한다.','다른 동물의 접근이 용이할 수 있는 개방된 장소가 좋다.'],a:[5],
 e:`<p class="why">돼지는 <b>소음 등으로 흥분하면 식자증</b>을 보여요 → 조용하고 다른 동물 접근이 없는 곳이 좋아요.</p><ul>
<li>② 최적 온도 29~35℃, 글리코겐 2~3시간 내 소모 → 가온등 ✓</li>
<li>④ 분만 후 48~72h 자돈 폐사 20~30%(주로 <b>압사</b>) → 분만틀 ✓</li></ul>`,
 s:'7-1 · I. 분만 준비 / 7-2 · 모성 행동(식자증)'},
{n:28,q:'젖소에서 분만 직후 자궁탈이 발생했다. 수의사 도착 전까지 취해야 할 행동으로 적절한 것은?',
 box:['가. 자궁정복을 위해 태반을 제거한다.','나. 탈출 자궁이 오염되지 않도록 한다.','다. 습윤한 타월로 감싸 건조하지 않게 한다.','라. 탈출 자궁을 외음부보다 높게 유지한다.','마. 옥시토신을 도포한다.'],
 o:['가, 나','나, 다, 마','나, 다, 라','가, 나, 다','라, 마'],a:[3],
 e:`<p class="why">보호자 응급처치 = <b>오염 방지 · 건조 방지 · 자궁을 받쳐 올리기</b>(울혈·부종 감소).</p><ul>

/* ---------- state ---------- */
const KEY='sangwa-mid-2025-2';
let st={mc:{},sa:{}};
try{const v=localStorage.getItem(KEY);if(v)st=JSON.parse(v)||st;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const norm=s=>(s||'').toLowerCase().replace(/[\s\-_.()·,/]/g,'');

/* ---------- render MC ---------- */
const mcList=document.getElementById('mcList');
MC.forEach(q=>{
 const d=document.createElement('div');d.className='card';d.id='m'+q.n;
 let h=`<div class="qh"><span class="qn">${q.n}</span><div class="qt">${q.q}</div></div>`;
 if(q.img)h+=`<div class="fig"><img src="${IMG[q.img]}" alt="${q.n}번 그림"></div>`;
 if(q.box)h+=`<div class="boxq"><ul>${q.box.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;
 h+=`<div class="opts${q.imgopts?' grid':''}">`;
 q.o.forEach((t,i)=>{
  if(q.imgopts)h+=`<button class="opt imgopt" data-i="${i+1}"><span class="row"><span class="c">${C[i]}</span><span class="mk"></span></span><img src="${IMG[t]}" alt="보기 ${i+1}"></button>`;
  else h+=`<button class="opt" data-i="${i+1}"><span class="c">${C[i]}</span><span>${t}</span><span class="mk"></span></button>`;
 });
 h+='</div>';
 h+=`<div class="actions">${q.multi?'<button class="btn chk" disabled>채점하기</button><span class="hint">2개를 고른 뒤 채점</span>':''}<button class="btn ghost retry" style="display:none">다시 풀기</button></div>`;
 h+=`<div class="res"></div>`;
 d.innerHTML=h;mcList.appendChild(d);
 const btns=[...d.querySelectorAll('.opt')];
 const chk=d.querySelector('.chk');
 let sel=[];
 btns.forEach(b=>b.addEventListener('click',()=>{
  if(st.mc[q.n])return;
  const i=+b.dataset.i;
  if(q.multi){
   if(sel.includes(i))sel=sel.filter(x=>x!==i);else if(sel.length<q.a.length)sel.push(i);
   btns.forEach(x=>x.classList.toggle('sel',sel.includes(+x.dataset.i)));
   chk.disabled=sel.length!==q.a.length;
  }else{st.mc[q.n]=[i];save();paintMC(q,d);score();}
 }));
 if(chk)chk.addEventListener('click',()=>{st.mc[q.n]=sel.slice();save();sel=[];paintMC(q,d);score();});
 d.querySelector('.retry').addEventListener('click',()=>{delete st.mc[q.n];save();sel=[];paintMC(q,d);score();});
 paintMC(q,d);
});
function paintMC(q,d){
 const pick=st.mc[q.n];const btns=[...d.querySelectorAll('.opt')];const res=d.querySelector('.res');
 const chk=d.querySelector('.chk');const retry=d.querySelector('.retry');
 btns.forEach(b=>{b.classList.remove('sel','correct','wrong');b.disabled=!!pick;});
 d.classList.remove('ok','no');
 if(!pick){res.className='res';res.innerHTML='';retry.style.display='none';if(chk){chk.style.display='';chk.disabled=true;chk.nextElementSibling.style.display='';}return;}
 const ok=pick.length===q.a.length&&q.a.every(x=>pick.includes(x));
 btns.forEach(b=>{const i=+b.dataset.i;if(q.a.includes(i))b.classList.add('correct');else if(pick.includes(i))b.classList.add('wrong');});
 d.classList.add(ok?'ok':'no');
 res.className='res show '+(ok?'ok':'no');
 res.innerHTML=`<div class="rt">${ok?'정답!':'오답'}</div><div class="ansline">정답 <em>${q.a.map(x=>C[x-1]).join(', ')}</em>${ok?'':' · 내 답 '+pick.map(x=>C[x-1]).join(', ')}</div>${q.e}${q.warn?'<div class="warn">'+q.warn+'</div>':''}<span class="src${q.ext?' ext':''}">${q.ext?'':'근거 · '}${q.s}</span>`;
 retry.style.display='';
 if(chk){chk.style.display='none';chk.nextElementSibling.style.display='none';}
}

/* ---------- render SA ---------- */
const saList=document.getElementById('saList');
SA.forEach(q=>{
 const d=document.createElement('div');d.className='card';d.id='s'+q.n;
 let h=`<div class="qh"><span class="qn">주${q.n}</span><div class="qt">${q.q}</div></div>`;
 if(q.img)h+=`<div class="fig"><img src="${IMG[q.img]}" alt="주관식 ${q.n}번 그림"></div>`;
 if(q.img2)h+=`<div class="fig two"><div><b>①</b><img src="${IMG[q.img2[0]]}" alt="①"></div><div><b>②</b><img src="${IMG[q.img2[1]]}" alt="②"></div></div>`;
 if(q.box)h+=`<div class="boxq"><ul>${q.box.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;
 h+='<div class="sa">'+q.f.map((f,i)=>`<label><b>${f.l}</b><input data-k="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="답 입력"></label>`).join('')+'</div>';
 h+=`<div class="actions"><button class="btn chk">채점하기</button><button class="btn alt show">정답만 보기</button><button class="btn alt accept" style="display:none">맞은 걸로 인정</button><button class="btn ghost retry" style="display:none">다시 풀기</button></div><div class="res"></div>`;
 d.innerHTML=h;saList.appendChild(d);
 const ins=[...d.querySelectorAll('input')];
 if(st.sa[q.n])ins.forEach((x,i)=>x.value=(st.sa[q.n].v||[])[i]||'');
 ins.forEach(x=>x.addEventListener('keydown',ev=>{if(ev.key==='Enter')d.querySelector('.chk').click();}));
 d.querySelector('.chk').addEventListener('click',()=>{const v=ins.map(x=>x.value);st.sa[q.n]={v,ok:gradeSA(q,v).every(Boolean)};save();paintSA(q,d);score();});
 d.querySelector('.show').addEventListener('click',()=>{const v=ins.map(x=>x.value);st.sa[q.n]={v,ok:false,peek:true};save();paintSA(q,d);score();});
 d.querySelector('.accept').addEventListener('click',()=>{st.sa[q.n].ok=true;st.sa[q.n].manual=true;save();paintSA(q,d);score();});
 d.querySelector('.retry').addEventListener('click',()=>{delete st.sa[q.n];ins.forEach(x=>x.value='');save();paintSA(q,d);score();});
 paintSA(q,d);
});
function gradeSA(q,v){
 const n=v.map(norm);
 if(q.any){ // 순서 무관
  const used=new Set();
  return q.f.map(f=>{const j=n.findIndex((x,k)=>!used.has(k)&&x&&f.acc.some(a=>x.includes(norm(a))));if(j>=0){used.add(j);return true;}return false;});
 }
 return q.f.map((f,i)=>!!n[i]&&f.acc.some(a=>n[i].includes(norm(a))));
}
function paintSA(q,d){
 const r=st.sa[q.n];const ins=[...d.querySelectorAll('input')];const res=d.querySelector('.res');
 const chk=d.querySelector('.chk'),show=d.querySelector('.show'),acc=d.querySelector('.accept'),retry=d.querySelector('.retry');
 d.classList.remove('ok','no');ins.forEach(x=>{x.classList.remove('good','bad');x.disabled=!!r;});
 if(!r){res.className='res';res.innerHTML='';chk.style.display=show.style.display='';acc.style.display=retry.style.display='none';return;}
 const g=r.peek?q.f.map(()=>false):gradeSA(q,r.v);
 if(q.any&&!r.peek){ins.forEach((x,i)=>{const v=norm(r.v[i]);const hit=!!v&&q.f.some(f=>f.acc.some(a=>v.includes(norm(a))));x.classList.add(hit||r.ok?'good':'bad');});}
 else ins.forEach((x,i)=>{if(!r.peek)x.classList.add(g[i]||r.ok?'good':'bad');});
 d.classList.add(r.ok?'ok':'no');
 res.className='res show '+(r.ok?'ok':'no');
 const head=r.ok?(r.manual?'정답 (직접 인정)':'정답!'):(r.peek?'정답 확인':'오답 · 철자·표기 차이면 "맞은 걸로 인정"을 눌러요');
 res.innerHTML=`<div class="rt">${head}</div><div class="ansline">정답 <em>${q.ans}</em></div>${q.e}<span class="src${q.ext?' ext':''}">${q.ext?'':'근거 · '}${q.s}</span>`;
 chk.style.display=show.style.display='none';retry.style.display='';
 acc.style.display=(!r.ok&&!r.peek)?'':'none';
}

/* ---------- score / filter ---------- */
function score(){
 let done=0,ok=0;
 MC.forEach(q=>{const p=st.mc[q.n];if(p){done++;if(p.length===q.a.length&&q.a.every(x=>p.includes(x)))ok++;}});
 SA.forEach(q=>{const r=st.sa[q.n];if(r){done++;if(r.ok)ok++;}});
 const tot=MC.length+SA.length;
 document.getElementById('score').innerHTML=`<span class="s1">맞힘 ${ok}</span> · <span class="s2">틀림 ${done-ok}</span><small>${done}/${tot} 풀었음</small>`;
 updateEmpty();
}
let filt='all';
document.querySelectorAll('.chip[data-f]').forEach(c=>c.addEventListener('click',()=>{
 filt=c.dataset.f;document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.toggle('on',x===c));
 document.body.classList.remove('f-undone','f-wrong');if(filt!=='all')document.body.classList.add('f-'+filt);updateEmpty();
}));
function updateEmpty(){
 const vis=[...document.querySelectorAll('.card')].some(c=>c.offsetParent!==null);
 document.getElementById('empty').style.display=vis?'none':'block';
}
document.getElementById('reset').addEventListener('click',()=>{
 if(!confirm('푼 기록을 모두 지울까요?'))return;
 st={mc:{},sa:{}};save();
 MC.forEach(q=>paintMC(q,document.getElementById('m'+q.n)));
 SA.forEach(q=>{const d=document.getElementById('s'+q.n);d.querySelectorAll('input').forEach(x=>x.value='');paintSA(q,d);});
 score();
});
score();
</script>
</body>
</html>
