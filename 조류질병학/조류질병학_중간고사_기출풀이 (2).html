<body>
<header>
  <div class="subj">조류질병학 · 장형관 교수님</div>
  <h1>중간고사 기출 풀이 <span style="font-weight:300">2021–2025</span></h1>
  <p>2025·2024·2022 답지 + 선배족보 반영 (✏️ = 족보로 고친 곳, 📒 = 족보 답) · 2020 중간과 각 연도 기말 문제는 족보에서 추가 · 답은 이 기기에 자동 저장됩니다 · 연도별 / 주제별(반복 출제 묶음)로 풀 수 있어요</p>
</header>

<script>
/* ===== 정답 (답지 받으면 여기 채우기) =====
   형식 예: ANSWERS['2025-1'] = {mc:2, html:'해설...'}  (mc는 0부터: ①=0)
            ANSWERS['2025-13'] = {ox:[0,1,4], html:'...'}
            ANSWERS['2024-3']  = {html:'...'}                         */
const ANSWERS = {};
/* 답지(2025·2024·2022, 기출집 p.208–222) — 2023·2021은 답지 없음 → 동일 문제 답을 출처 표시해서 가져옴
   mc: 정답 index / ox: 틀린 보기 index / oxr: 보기별 고침 / f: 칸별 답 / t: 표 답 / z: 빈칸 답
   from: 다른 해 답지에서 가져온 경우 / warn: 답지끼리 다르거나 주의할 점 / src: 답지 출처 */
const ALL6=[0,1,2,3,4,5];
const K={
 nab25:{f:['HN, F','G, F','S1','HA, NA','VP2','VP1','capsomere (Hexon)','VP1','σC','gp85'],src:'ND ppt 7·17p, aMPV ppt 6p, IB ppt 6p, AI ppt 7·20p, IBD ppt 9p, CIA ppt 7p, FAdV ppt 7p, AEV ppt 5p, ARV ppt 8p, ALS ppt 10p, 교재 4·15·157p'},
 aiv25:{f:['막대모양 삼량체 / 부착 → 침입','버섯모양 사량체 / 해리','핵산 배출 관련 단백질','인터페론 길항작용 → 바이러스 병원성 관련'],src:'조류인플루엔자 ppt 7p'},
 herp:{f:['Gallid alphaherpesvirus 1','Gallid alphaherpesvirus 2','Gallid alphaherpesvirus 3','Meleagrid alphaherpesvirus 1']},
 ndvp:{f:['9~11일령 SPF 발육란 (MDT)','1일령 SPF 병아리 (ICPI)','6주령 SPF 닭 (IVPI)'],src:'1장 뉴캣슬병 PPT 11p'},
 onco:{f:['Meq (Marek’s EcoRI-Q)','v-onc (급성으로 종양 유발)','v-rel'],src:'교재 136·161p, 세망내피증 ppt 7p'},
 ampvddWarn:'✅ 수업 PPT로 확정 — 닭 MG / 칠면조 Coryza (2025 답지의 "두부종창증후군 / 칠면조 비기관염"은 오답 · 2024·2022 답지가 맞음)',

setA('2024-23',{html:'<b>리비히의 최소량의 법칙</b> — 1840년 리비히가 질소·인산·칼리 등 식물 성장 필수 영양소 중 성장을 좌우하는 것은 넘치는 요소가 아니라 <b>가장 부족한 요소에 의해 성장이 결정</b>된다고 발표. 하나라도 부족하면 다른 것이 아무리 많아도 제대로 자랄 수 없음 → <b>최대가 아니라 최소가 성장을 결정</b>.<br><b>가금농장 방역관리에 적용</b> — 물통(나무판 높이가 각 요소)처럼, 방역 요소(통제·청소·소독·시설보수·백신 등) 중 <b>가장 취약한 한 곳의 수준이 농장 전체 방역 수준(성과)을 결정</b>함. 나머지를 아무리 잘해도 출입구·배수구(쥐 유입) 같은 빈틈 하나, 혹은 지키지 않는 한 사람 때문에 병원체가 들어오고 손실(돈과 시간)이 생김.<br>→ 깨진유리창 법칙도 같은 뜻: <b>100 − 1 = 0</b> (하나만 빠져도 방역은 0), 0 + 1 = 100 · 그래서 교육과 실행 여부 점검, 채찍과 당근, 지속적·단계적 목표 상향이 필요 — "내 농장은 내가 지킨다!"',src:'가금질병관리의 이해 PPT 17·18·20p (물통 그림 해석 포함)'});
setA('2024-26',{html:'<span class="sbtag">선배족보</span> <b>옛 PPT "가금백신 접종효능 저하요인"</b> (2020 중간에 그대로 출제)<br>① <b>모체이행항체 수준 및 균일도</b><br>② <b>백신접종 시술상의 문제</b> — 부정확한 접종, 생백신 자체 전파력에 의존하는 것은 위험, 백신접종기구 소독<br>③ <b>질병상재지역</b> — 방어능 도달 소요시간 염두<br>④ <b>면역억제</b> — 백신능 저하 및 심한 접종반응 (전염성 질병: IBD, MD, CIA, Reo / 영양·스트레스·Toxin)<br>⑤ <b>백신의 효능저하</b> — 접종시간 지연(MD, IB 1시간 이내 접종완료), 보관 및 운송문제(break cold chain)<br><span style="color:#6b6b6b">지금 PPT엔 없는 슬라이드라 23p 집단면역 고려사항(균일 접종·dose·사육밀도 등)과 섞어 써도 됨</span>',src:'장형관 옛 PPT 42p (선배족보) · 총론 23p'});
setA('2024-27',{html:'<b>중요성</b><br>· 살모넬라 중 <b>추백리(S. Pullorum)·가금티푸스(S. Gallinarum)</b>는 <b>난계대전염병</b>(제2종 법정전염병)이고, <b>S. Enteritidis</b>는 제3종으로 신규 지정, S. Typhimurium·Enteritidis는 공중위생(식중독) 문제 (7·11·12p)<br>· 부화장은 PL·GGPS → GP → GPS → PS → CC → 브로일러로 이어지는 <b>생산 피라미드의 연결 고리</b> — 상위 1개 계군이 하위 수많은 계군(GPS 150 → CC 2,100만 수)으로 확대되므로, 부화장 한 곳이 오염되면 하위 단계 전체로 퍼짐 (3·28p)<br>· 그래서 「종계장·부화장 방역관리요령」(농식품부 고시)으로 <b>난계대 전염병을 관리</b> (11p)<br><b>모니터링 내용</b> (29·30p)<br>· 부화장 위생검사: 표면·공기중 세균 및 곰팡이 검사 월 1회, <b>환경·기기·기구 살모넬라 검사 월 2회</b><br>· GPS/PS 살모넬라 모니터링 계군당 18회, 발생계군 살모넬라 검사(약추, 난각 등), 종란실 위생검사, 깔짚·사료 내 살모넬라 검사<br><b>의미</b> (28·31p)<br>· 질병 발생상황을 <b>조기에 파악 → 즉시 현지조치 → 정확한 실험적 진단으로 농장별 맞춤 후속조치 → 질병 손실 최소화</b><br>· 질병·위생관리 제반검사의 최종목표는 <b>차단방역</b> → 모니터링 → 결과확인·문제점 발생 시 Action 수립 → 문제점 해결 → 꾸준한 생산성 확보<br><b><span class="sbtag">선배족보</span> 옛 PPT 내용 (외워두면 좋음)</b><br>· 부화장은 <b>60% 전후 습도, 37°C 전후 온도</b>, 저항력 없는 숙주를 갖춘 살모넬라 최적의 증식조건<br>· 부화장에서 살모넬라가 분리되면 → 종계농장 혹은 부화장이 감염되었음을 의미 → <b>종계농장과 부화장을 한번에 스크린</b>할 수 있는 장점<br>· 부화장 모니터링 시료: <b>약추(culls)</b>, <b>면모(fluffs)</b>, <b>태변(meconium)·hatch tray paper</b>, <b>난각(egg shells)</b>, 부화장 환경, 부화장 직원',src:'가금질병관리의 이해 PPT 3·7·11·12·28·29·30·31p'});
setA('2024-30',{html:'<b>PPT 4p 가금농장의 생산성에 영향을 미치는 요소</b><br>① <b>전염성 질병</b>(Virus, 세균, 곰팡이, 기생충) — 폐사·증체 저하·산란저하로 직접 손실<br>② <b>계사환경</b>(온도, 습도, 환기) — 스트레스·호흡기 질병 유발, 사료효율 저하<br>③ <b>사육시설</b>(급이, 급수) — 사료·물 섭취가 고르지 않으면 성장·균일도 저하<br>④ <b>사료</b>(원료품질, 마이코톡신) — 영양 불량, 곰팡이독소로 면역억제·성장저하<br>⑤ <b>차단방역 및 예방접종</b> — 질병 유입·확산을 막는 기본<br>⑥ <b>PS(종계)의 영양상태</b>(아미노산, 비타민) — 병아리 품질 결정<br>⑦ <b>PS의 주령</b>(신계, 노계) — 종란·병아리 품질 차이<br>⑧ <b>PS의 위생 및 면역수준</b>(난계대 질병, 모체이행항체) — 병아리 초기 방어력·난계대 감염 좌우<br><span style="color:#6b6b6b">요소 8가지는 4p 그대로, 각 요소 옆 "이유"는 PPT에 적혀 있지 않아 제가 보충한 것 · 5p 질병 만연 요소(사육밀도, 다일령계군, 다른 종류 가금, 지역 내 농장밀도, 사양·위생관리 불량, 사육간 휴지기, 동시감염)도 이유로 활용 가능</span>',src:'가금질병관리의 이해 PPT 4·5p'});
setA('2021-3',{html:'<b>PPT 11p 난계대전염병</b> 중 바이러스성:<br>① 닭백혈병 (Lymphoid Leukosis; LL — ALV)<br>② 세망내피증 (RE)<br>③ 닭뇌척수염 (AE)<br>④ 닭전염성빈혈 (CIA)<br>⑤ 산란저하증후군 (EDS76)<br>⑥ 레오바이러스감염증 (Reovirus)<br><span style="color:#6b6b6b">(나머지 추백리·가금티푸스·마이코플라즈마병은 세균성 · AI는 난계대 근거 없음 — 2025 3번)</span>',src:'가금질병관리의 이해 PPT 11p (답지 없어 PPT로 작성)'});
K.ibvg={html:`<b>① 유전체 도식</b> (IB PPT 9p)
<div class="gen"><span class="g-u">5′</span><span class="g-l">L</span><span class="g-r" style="flex:5">Replicase 1a / 1ab</span><span class="g-s" style="flex:1.6">S</span><span class="g-a">3a 3b</span><span class="g-e">E</span><span class="g-m">M</span><span class="g-a">5a 5b</span><span class="g-n" style="flex:1.1">N</span><span class="g-u">3′</span></div>
<b>5′-UTR – leader – 1a/1ab – S – 3a – 3b – E – M – 5a – 5b – N – UTR-3′</b><br>
· (+) sense ssRNA, 선형(linear), 약 27.5~28 kb, 외피막 보유 (6p)<br>
· <b>UTR</b>(untranslated region) : 바이러스 RNA 전사 및 복제(증식)에 관여<br>
· <b>Replicase 1a, 1b</b> : 유전체 복제, 4종 구조단백질과 15종 비구조단백질 형성에 관여<br>
· <b>3a, 3b, 5a, 5b</b> : 기능이 밝혀지지 않은 비구조단백질<br>
<b>② 6종 subgenomic mRNA와 합성 단백질</b> (9p) — 각 mRNA는 5′ 끝에 leader 서열을 공유하고 3′ 끝까지 이어지는 중첩(nested) 구조
<table class="mini"><tr><th>mRNA 1</th><td>Polymerase (Replicase 1a/1ab) → 유전체 복제, RdRp</td></tr><tr><th>mRNA 2</th><td><b>Spike (S)</b> → S1·S2 (S1: 중화항체 유도·항원결정기, 수용체 부착 / S2: M과 결합해 S1 지지하는 막관통 부위)</td></tr><tr><th>mRNA 3</th><td>3a / 3b / <b>E</b> (envelope, 지질이중막)</td></tr><tr><th>mRNA 4</th><td><b>Membrane (M)</b> → IBV 공통항원</td></tr><tr><th>mRNA 5</th><td>5a / 5b (기능 미상 비구조단백질)</td></tr><tr><th>mRNA 6</th><td><b>Nucleocapsid (N)</b> → IBV 공통항원(group-specific), 유전체와 결합해 RNP 형성</td></tr></table>
<b>③ (덧붙이면 좋은 것) 복제 과정</b> (10p) — S1의 RBM이 숙주세포 수용체 결합·막융합 → 게놈 세포질 유입 → <b>RdRp에 의해 subgenomic mRNA 전사</b> 및 단백질 합성 → S·E·M은 골지체 막으로 이동, N은 새 유전자와 RNP 형성 → N·E·M 상호작용으로 소포체(RE) 막에서 출아 → 세포막 융합으로 방출<br>
· S 단백질 전구체 S0 → 세포 단백분해효소로 S1(520 aa)·S2(625 aa) 수식, cleavage site R-R-F-R-R`,src:'3장 전염성기관지염 PPT 6·9·10p (답지 없어 PPT로 작성)'};

K.ibda={html:`<b>① Segment A 도식</b> (IBD PPT 7p) — dsRNA 약 3.3 kb, 5′/3′ 말단 모두 79~111 bp UTR, 5′ 끝에 VP1(VPg) 결합
<div class="gen"><span class="g-u">5′</span><span class="g-a" style="flex:1.2">ORF1<br>VP5</span><span class="g-r" style="flex:5">ORF2 : pVP2 ─ VP4 ─ VP3 (polyprotein)</span><span class="g-u">3′</span></div>
<div class="gen" style="margin-top:-4px"><span style="flex:0.4;background:none"></span><span style="flex:1.2;background:none;color:#6b6b6b;font-weight:400">ORF2와 일부 중첩</span><span class="g-s" style="flex:2.5">pre-VP2 (pVP2, VPX)<br>1~512</span><span class="g-m" style="flex:1.2">VP4<br>513~755</span><span class="g-n" style="flex:1.3">VP3<br>756~</span><span style="flex:0.4;background:none"></span></div>
· <b>ORF1 → VP5</b> 암호화 (ORF2와 부분적으로 중첩)<br>
· <b>ORF2 → pVP2–VP4–VP3</b> 다단백질(polyprotein) 형태로 동시 번역 → <b>VP4(protease)에 의해 절단</b>되어 pVP2, VP3, VP4 생성 (절단부위 512/513, 755/756)<br>
· pre-VP2(pVP2, VPX) 성숙 → <b>VP2(1~441) + 4종 small peptides(pep46, 7, 7, 11)</b> · VP2 내 hypervariable region (그림상 709~1,146)<br>
<i>(참고) Segment B (약 2.9 kb) : ORF3 → VP1</i><br>
<b>② 발현 단백질·펩타이드의 기능</b> (8·9·11·12p)
<table class="mini">
<tr><th>VP2</th><td><b>외부 capsid 단백질</b> — 260개 삼량체로 외각 형성, 4종 peptide와 함께 조립 · <b>중화항체 유도(방어 면역원성) 항원</b>, 가변영역(hot spot 212~224/248~252/279~290/314~324 aa)이 가장 외측 loop · 세포 수용체 결합(integrin-binding motif) · 병원성·F낭 친화성에 관여</td></tr>
<tr><th>small peptides</th><td>pep46·pep11 : 기하학적 구조형성 조절 결정체 · <b>pep46 : 소낭(endosome) 막에 구멍</b> → 바이러스 유전체가 세포질로 유출되는 통로 형성 (세포내 감염에 중요)</td></tr>
<tr><th>VP3</th><td><b>내부 capsid·핵산단백질</b> — dsRNA와 결합해 섬유소성 구조 유지, VP3 자체·pVP2·VP1·유전체와 상호작용 → <b>입자 조립·완전한 capsid 형성</b>(C-말단이 VP2와 결합) · 유전체 비결합 RdRp(VP1)를 활성화 · 초창기 면역원성 항원(중화와 무관)</td></tr>
<tr><th>VP4</th><td><b>단백분해효소(protease)</b> — Ser-Lys 잔기에 작용, polyprotein 절단과 VP2 성숙(수식)에 중요</td></tr>
<tr><th>VP5</th><td><b>바이러스 증식 기능</b> — 감염 초기 caspase·NF-κB 경로 방해로 세포자살(apoptosis) 지연·방지 → 증식 도움 · 세포막에 구멍 형성 → 성숙 입자 방출·확산</td></tr>
</table>
<b>③ 입자 형성 순서</b> (12p) — VP1이 vRNA와 가장 먼저 결합 → VP3가 VP3·pVP2·VP1·유전체와 상호작용하며 부분 조립·capsid 형성 → 조립 완료된 capsid 안에서 <b>pVP2 C말단 peptide가 순차 절단</b>되며 VP2로 최종 성숙 → VP5가 세포자살 지연 + 막 구멍으로 방출`,src:'7장 전염성F낭병 PPT 6~12p (답지 없어 PPT로 작성)'};

K.gen={html:`<span class="sbtag">선배족보</span> (1장 뉴캣슬병 PPT 7·9p, 2장 aMPV PPT 6·7p)
<div class="gen"><span class="g-u">3′</span><span class="g-n">N</span><span class="g-a">P</span><span class="g-m">M</span><span class="g-r">F</span><span class="g-s" style="flex:1.3">HN</span><span class="g-e" style="flex:2!important">L</span><span class="g-u">5′</span></div>
<b>NDV</b> : 3′-N-P-M-F-<b>HN</b>-L-5′ (6개 ORF, (−) non-segmented ssRNA, 약 15 kb)
<div class="gen"><span class="g-u">3′</span><span class="g-n">N</span><span class="g-a">P</span><span class="g-m">M</span><span class="g-r">F</span><span class="g-l" style="flex:0.7!important">M2</span><span class="g-l" style="flex:0.6!important;background:#999">SH</span><span class="g-s">G</span><span class="g-e" style="flex:2!important">L</span><span class="g-u">5′</span></div>
<b>aMPV</b> : 3′-N-P-M-F-<b>M2-SH-G</b>-L-5′ (8개 ORF, 약 14 kb)
<table class="mini"><tr><th></th><th>NDV</th><th>aMPV</th></tr>

  A:{html:'① <b>수직전파</b>: 감염 종계에서 난계대전염된 개체를 중심으로 2차 수평전파가 확대되는 유형 — 수직감염 어린 병아리는 바이러스 배출·항체형성 없음 → 성계가 되어 산란율 50% 이상(산란피크)이 되면 잠복했던 EDSV가 활성화되어 체외 배출<br>② <b>수평전파</b>: 감염 계군·농장에서 쓰던 난좌, 포장재, 수송상자 등으로 확산 · 자궁·수란관에서 증식한 바이러스가 계란 속·난각을 통해 배출<br>③ <b>자연감염(야생조류)</b>: 자연감염된 오리·거위·야생조류의 배설물 속 바이러스가 오염된 물·매개체를 통해 농장 내로 유입',src:'10장 EDS PPT 8p'}},

 {n:16,t:'fill',g:'nddd',q:'ND는 신경계, 호흡기계 및 소화기계에 이르기까지 다양한 증상을 보이는 질병이다. 각 임상증상별 또는 육안병변별 감별이 필요한 질병을 각각 2종 이상 예시하시오.',f:['(1) 급격한 대량 폐사','(2) 호흡기증상 및 산란율 저하','(3) 신경증상 및 뇌병변','(4) 선위출혈'],

 {n:22,t:'essay',g:'ciaiso',q:'CIA의 야외주 분리를 위한 검체와 배양법 및 동정법에 대하여 설명하시오.',
  A:{html:'<b>검체</b>: 간 조직, 전혈, PBMC(백혈구층 buffy coat), 흉선, 골수 등 (감염 1주 이내 높은 역가)<br><b>배양</b>: 유제 후 클로로포름 처리 → <b>MD 유래 T세포주(MDCC-MSB1, MDCC-CU147)</b>에 접종 → 2~4일 간격 약 10대 연속계대 → CPE 확인 · <b>SPF 1일령 병아리</b> 접종 → 12~16일 후 빈혈·흉선 위축 확인 (종란은 5~6일령 난황 접종)<br><b>동정</b>: PCR(가장 널리), 간접형광항체법(IFA), 바이러스 중화시험(VN), ELISA로 항체 확인',src:'8장 CIA PPT 9·18p, 교과서 89p'}},

  A:{html:'· <b>VP1</b>: RNA 의존성 RNA 중합효소(RdRp), capsid 내 유전체와 결합 또는 독립적으로 존재<br>· <b>VP2</b>: 외부 capsid — 260개 삼량체로 외각, 중화항체 유도·수용체 결합<br>· <b>VP3</b>: 내부 capsid·핵산단백질 — dsRNA와 결합, 조립, C말단이 VP2와 결합<br>· <b>VP4</b>: 단백분해효소(Ser-Lys), polyprotein 절단·VP2 성숙<br>· <b>VP5</b>: 세포자살 저해 → 증식 도움, 세포막 구멍 → 입자 방출<br>· <b>small peptides</b>(pep46, 7, 7, 11): pVP2 C말단에서 잘려 나옴 — pep46/11은 구조형성 조절, <b>pep46</b>은 소낭막에 구멍 → 유전체 세포질 유출',src:'7장 IBD PPT 8p'}},

 {n:28,t:'fill',g:'salm',q:'농장에 초생추 입추 시 살모넬라 모니터링을 위한 주요 시료에 대하여 설명하시오.',f:['1)','2)','3)'],
  A:{f:['Chick box liners — 초생추가 살모넬라 오염 시 태변으로 배출 → 박스 운반 중 배출한 태변이 깔짚을 오염 → 아주 좋은 시료','Dead on Arrival — 운송 스트레스 등으로 가장 약한 개체부터 폐사, 약한 초생추일수록 면역이 떨어져 살모넬라 증식 용이 (liver, intestine)','1~7 days Mortalities (1주령 폐사) — 살모넬라 난계대 전염 시 1주령 이내 폐사 개체에 존재할 가능성 높음'],src:'선배 PPT (현재 PPT엔 없음)'}},

 {n:31,t:'fill',g:'salm',q:'종계농장의 살모넬라 모니터링을 위한 주요 시료에 대하여 설명하시오.',f:['1)','2)','3)','4)'],
  A:{f:['Vent swab(총배설강 swab) — 총 사육수수 대비 1.5% (2만 수 규모 = 300개 샘플)','깔짚(Drag) — 살모넬라는 분변으로 배출 → 주변으로 퍼짐, 깔짚 상태가 나쁠수록 오래 생존','먼지(Dust) — 먼지 1개당 10개 이상 세균 부착, 깔짚에서 발생한 먼지에 다수 살모넬라 → 오염 시 가장 먼저 분리되는 샘플','공기(Air sampler) — 먼지 속 살모넬라 검출, 전배양 과정 없음, 고가 장비·샘플링 시간 소요되지만 2일 이내 유무 확인'],src:'선배 PPT (현재 PPT엔 없음)'}},
 {n:33,t:'fill',g:'law',q:'국내 가금법정전염병으로 지정된 질병은 \'가축전염병예방법\'에 따라 차등적인 방역조치를 취하고 있다. 법정전염병별 취할 수 있는 해당 방역조치에 O, X로 각각 표기하고 해당 법정전염병을 예시하시오.',note:'족보: 표 빈칸 채우는 문제였을 듯 — 표 싹 외우기',f:['제1종','제2종','제3종'],A:LAWT_A},
 {n:35,t:'fill',g:'terms',q:'야외분리 바이러스에 대한 아래 분류유형별 용어의 의미를 설명하시오.',f:['(1) 혈청형 (serotype)','(2) 유전형 (genotype)','(3) 병원성형 (pathotype)','(4) 항원형 (antigenic type)'],

'2024-21':`V-A−, V-A+, V+A−, V+A+ / V+A− 형태가 난계대전파 가장 용이, 난관의 난백 분비선에서 증식 — <b>위 답과 같음</b>`,
'2023-30':`족보 답 칸 비어 있음 — PPT 3장 9p + 교과서 24p 캡처 (위 답이 그 내용). 교과서: "S, E, M 및 P 유전자… 5종의 subgenomic mRNA가 먼저 만들어지고…" 표현도 있음`,
'2022-30':`족보 손그림: 5′-VP1-[ORF1 → VP5] / [ORF2 → Pre-VP2(pVP2,VPX)-VP4-VP3] → Pre-VP2 → VP2 + 4 small peptides — <b>위 도식과 같음</b>`,
'2023-6':`<b>위 답이 족보 답</b> — 족보 메모 "모든 사람의 필기를 확인한 결과 이게 정답!!!!" / 카톡 "21페이지 TOC 일령 PPT 기반 + 선배들 자료 다 취합: CEF 9~11일 CEK 18일 CEL 14일 CELu 14일 CK 3~6주 TOC 부화직전/1~2일령" / 챗GPT 표(CEK·CEL·CELu 14~16일령, CK·TOC 2~4주령)는 참고만`,
'2023-8':`족보 답 칸 비어 있음 — PPT 5장 14p: (1) 계태아 섬유아세포(CEF), 계태아 신장(CEK) 초대배양세포 (2) MDCK(Madin-Darby canine kidney), DF-1 세포주 — <b>위 답과 같음</b>`,
'2023-14':`1) 선위, 근육층에서 과도하게 증식된 림프구의 침윤 2) 췌장, 림프소절의 증식 3) 대뇌(신경세포), Nissl body 소실에 의한 central chromatolysis — <b>위 답과 같음</b> (교과서 119p)`,
'2023-15':`<b>위 답이 족보 답</b> (a 폐 b B림프구 c 6~7일 d CD4+ T e CD8+ T f B세포 g 림프장기 h 내장기관 i 흉선 j F낭 k 종양화 l 림프종)`,
'2022-5':`IgM 발현 미성숙 B림프구: 세포막 glycoprotein / DT40: IgM λ light chain / DF1: chicken heat-shock protein 90 / 3T3: α4β1 integrin — <b>위 답과 같음</b>`,
'2022-22':`<b>위 답이 족보 답</b> (교과서 20p 6가지)`,
'2021-3':`닭백혈병, 세망내피증, 닭뇌척수염, 닭전염성빈혈, 산란저하증후군, 레오바이러스감염증 — <b>위 답과 같음</b> (총론 11p)`,
'2021-5':`<b>위 답이 족보 답</b>`,
'2024-28':`1) 목적: 백신에 대한 효능점검 / 백신을 실시하지 않는 질병의 유입 여부 모니터링 2) 평판응집시험, 한천겔내면역침강시험, 바이러스중화시험, 혈구응집저지시험 — 위 답과 같음<br><span style="color:#6b6b6b">족보: "면역형광법은 근거는 딱히 없는데 선배들 답 따라서…" · 선배 PPT: PA(MG/MS, Salmonella) · AGP(AI, IBD, MD, IBV) · VN(CAV, IBD) · HI(NDV, IBV, AIV, EDS)</span>`,
'2024-29':`1) 주사접종: ND, MD, RA(리메렐라 아나티페스티퍼감염증), DHAV(오리간염A) 2) 점안: ND, IB, ILT 3) 음수: RA, DHAV, ND, IB, IBD, AE 4) 분무: ND, IB 5) 천자: FP 6) 사료첨가: 콕시듐 7) In-ovo(18일령 부화란): MD, rMD+ND, IBD — <b>위 답과 같음</b>`,
'2024-22':`1) 모든 개체에 균일한 백신접종 2) 접종 Dose 및 백신 접종량 결정 3) 사육형태, 사육밀도 4) 백신접종반응 고려 5) 백신 및 백신접종방법 선택 6) 질병발생 상황 등 고려 — <b>위 답과 같음</b> (족보: 24년은 주의사항, 20년은 주요사항)`,
'2024-23':`"리비히의 최소량의 법칙은 가장 부족한 요소에 의해 성장이 결정된다는, 최대가 아닌 최소가 성장을 결정한다는 이론이다. 이는 가금농장의 방역관리에서 기본이 되는 <b>통제, 청소, 소독, 시설 보수 중 어느 하나라도 부족하다면</b> 다른 것이 충분하더라도 문제가 생길 수 있다는 것으로 <b>모든 요소가 관리되어야 함</b>을 의미한다." <span style="color:#6b6b6b">← 시험 답안 길이로 딱 좋음</span>`,
'2024-24':`1) <b>통제</b>: 감염동물이 병원체를 배설하지 않도록 환축을 격리/치료 2) <b>청소</b>: 오염된 축사, 사료, 물, 의복 등 3) <b>소독</b>: 오염물질의 제거, 병원체 사멸율 증가 4) <b>시설보수</b>: 생존한 병원체가 감수성동물로 전파되지 않도록 시설을 정비 (총론 18·19p)`,
'2024-25':`6가지 (총론 25p) — <b>위 답과 같음</b>`,
'2024-26':`<b>위 답이 족보 답</b> — 1) 모체이행항체 수준 및 균일도 2) 백신접종 시술상의 문제 3) 질병상재지역: 방어능 도달 소요시간 염두 4) 면역억제: 백신능 저하 및 심한 접종반응 5) 백신의 효능저하 · 족보: "이랬는데 이게 작년 중간고사에 나옴…" (옛 PPT 42p, 지금 PPT엔 없음)`,
'2024-27':`<b>① 우리 PPT 버전</b>: 살모넬라는 어린 오리와 닭의 폐사/허약/설사를 일으키므로 GPS(원조계)/PS(종계)는 계군당 18회 살모넬라 모니터링을 실시해야 하고, 발생계군의 약추, 난각 등에 살모넬라 검사가 필요하며, 부화장 환경내/기기/기구 살모넬라 위생검사도 월 2회 실시하여야 할 만큼 중요하다.<br><b>② 옛 PPT 버전</b> (족보: "선택해서 마음에 드는 걸로 외우세요"): 부화장은 60% 전후 습도, 37도 전후 온도, 저항력이 없는 숙주를 갖춘 최적의 증식조건이다. 부화장에서 살모넬라가 분리된다면 종계농장/부화장이 살모넬라에 감염되었음을 의미하므로 부화장 살모넬라 모니터링은 종계농장과 부화장을 한꺼번에 스크린할 수 있는 장점이 있다. 부화장 살모넬라 모니터링은 약추(culls), 면모(fluffs), 태변(meconium), hatch tray paper, 난각(egg shells), 부화장 환경, 부화장 직원에 대해 이루어져야 한다.`,
'2024-30':`1) 전염성 질병 2) PS의 위생 및 면역수준: 난계대질병 방지, 모체이행항체 전달 3) PS의 주령: 신계는 산란 불안정, 노계는 수정률/부화율 낮음 4) PS의 영양상태: 아미노산, 비타민 결핍 등은 생산 효율 저하 5) 차단방역 및 예방접종 6) 계사환경: 온도, 습도, 환기 불량시 스트레스, 성장률/산란율 저하 7) 사육시설: 급이, 급수 등이 불량하면 섭취 불균형 발생 8) 사료: 원료품질이 낮거나 마이코톡신이 존재하면 산란율 감소 <span style="color:#6b6b6b">← 이유까지 한 줄씩 붙어 있어 답안용으로 좋음</span>`,
'2025-13':`① <s>모든</s> — C형은 섬모손상 일으키지 않음 (TOC 부적합) ② 모체이행항체 효과적이다 → <b>효과 X</b> ③ <s>수직감염</s> — 수평전파만 ④ A·B는 교차면역 O (D 지움) ⑤ 심한 → <b>약한</b> ⑥ <s>칠면조</s> → <b>육계(닭)</b>의 두부종창증후군 — 6개 모두 틀림, 위 답과 같음 (PPT 2장 3·8·10·13·17p)`,
'2025-14':`<b>위 답이 족보 답</b> — 족보에서 동그라미 친 건 ①③⑤⑥만: ① <s>난각표면</s>, <s>수직</s> ③ 잠복기 <s>길어서</s> → 짧아 / <s>서서히</s> → 빠르게 ⑤ 감별 <s>용이</s> → 어려움 ⑥ <s>Nucleocapsid</s> → structural(S) — ②④는 PPT 18·20p 캡처를 근거로 남겨 둠`,
'2025-15':`<b>위 답이 족보 답</b> — ① 성계 ③ 근거 X ④ 각질·비듬에 싸여 X, 쉽게 불활화 ⑤ 세포질 → 핵내 ⑥ 빠른 → (ND·AI가 더 빠름) / ② "CEL, CELu, CEK"는 동그라미 없음 (PPT 4장 15p 초대배양세포 CELu, CEL, CEK, CK)`,
'2025-16':`① 공기 → <b>모기</b> ② 칠면조에 국한 X (다양한 조류) ③ <b>눈 점막</b> 감염 바이러스는 눈물샘 따라 후두 → 상부 호흡기 감염 (ILT와 유사한 건 점막형의 기관 결절) ④ 가벼운 → <b>경증~중증</b> ⑤ <b>여름철·초가을</b> 다발 ⑥ 닭에 <b>비병원성</b>, 비둘기에 질병<br><span style="color:#6b6b6b">족보 메모: "책에 3번 선지 거의 그대로 있어서 맞는 선지라고 생각했는데 시험에서 틀린 부분 고치라고 나옴…" → ③도 틀린 보기로 확정</span>`,
'2025-17':`답: <b>2, 3, 4, 5, 6</b> (①은 옳은 문장으로 봄 — "실험실에서는 감염 성립 안 됨"이라 메모했지만 항체양성 보고 자체는 맞다고 판단)<br>② 수직 + 수평 ③ F낭 → 흉선 (F낭은 덜함) ④ VP2 → VP3 ⑤ "~에서만" X — SPF 1일령 병아리에서도 증식 ⑥ 단독감염 X — 세균·바이러스·곰팡이 복합감염 (PPT 8장 8·10·11·12·14·15p)`,
'2025-18':`1) 주로 수직감염 → 수직·수평감염 / 일령 증가할수록 저항성 → 어린 병아리에선 바이러스 배출·항체형성 없음 2) 난계대만 → 수직·수평전파 3) Fowl → <b>Duck</b> 4) 단일 혈청형 → 백신 방어면역 탁월, 접종 전략 단순 5) 잘 증식 → 증식 불가 또는 매우 낮음 6) 빠르며 → <b>매우 느리며</b> — 위 답과 같음 (PPT 10장 5·6·8·14p)`,
'2025-1':`<b>2021 기말 1번(비슷한 보기)</b> 답 ⑤ 오리간염 · ① 핵내 → 세포질내 ② 오리 → 칠면조 ③ 성계 → 4주령 이하 ④ 분변 → 공기 수평전파·호흡기`,
'2025-2':`<b>2021 기말 2번(같은 보기)</b> 답 ② — "전염성 F낭병은 2주령 이하에서 폐사 현저하지 않음"`,
'2025-3':`<b>2021 기말 12번(비슷한 문제)</b> — 난계대 아닌 것 = 전염성기관지염 · 난계대 바이러스: FAdV(+EDS), AEV, CIAV, ALSV, REV`,
'2025-4':`<b>2021 기말 14번(같은 문제)</b> 답 ② 신경계 질환`,
'2025-5':`<b>2021 기말 10번(같은 보기)</b> 답 ④ A, B형 아형간 교차면역 가능 · ① 응집 X ② 동일 family X ③ 수직 X ⑤ 감수성 높아 X (칠면조보다 증세 약함)`,
'2025-6':`<b>2021 기말 4·5번(AI)</b> — 4번 옳지 않은 것: NA가 수용체 결합(→HA) / 5번 옳은 것: H5/H7 아형에서 고병원성 AI가 주로 나타남`,
'2025-8':`<b>2021 기말 8번(같은 문제)</b> 답 ① 뉴캣슬병`,
'2025-9':`<b>2021 기말 9번(같은 보기)</b> 답 ① FAdV 4 · 족보: "교차방어는 한 병원체 면역반응이 다른 병원체 공격까지 방어하는 현상인데 여기서는 해당하지 않는다"`,
'2025-10':`<b>2021 기말 7번(같은 보기)</b> 답 ⑤ 2차감염 감수성 높다 · ① 열·산에 강함 ② 응집능 없음 ③ 어린 일령 ④ B림프구`,
'2025-11':`<b>2021 기말 3번(MD 옳지 않은 것)</b> 답 ③ 야생조류·포유류는 무증상 감염원 X(비감염)`,
'2025-12':`<b>2021 기말 13번(같은 문제)</b> 답 ⑤ 췌장`

function sbFor(q){

 if(SBC[q.id])return SBC[q.id];
 const ci=DUPOF[q.id];if(ci==null)return '';
 for(const m of DUP[ci]) if(SBC[m]) return SBC[m];
 return '';
}

/* ===== 저장 ===== */
const KEY='avian-midterm-2021-2025';
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ===== 렌더 ===== */
function ta(k,ph,rows,cls){return `<textarea data-k="${k}" rows="${rows||1}" placeholder="${esc(ph||'')}"${cls?` class="${cls}"`:''}>${esc(S[k])}</textarea>`}
function body(q){
 const id=q.id;
 if(q.t==='mc') return `<div class="ch">${q.c.map((x,i)=>`<button class="opt${S[id]===i?' sel':''}" data-mc="${id}" data-v="${i}"><b>${C[i]}</b><span>${x}</span></button>`).join('')}</div>`;
 if(q.t==='ox') return `<div class="ch">${q.c.map((x,i)=>{const on=!!S[id+':c'+i];return `<div class="ox"><label class="opt${on?' sel':''}"><input type="checkbox" data-k="${id}:c${i}"${on?' checked':''}><b>${C[i]}</b><span>${x}</span></label>${PEN?'':ta(id+':r'+i,'틀린 이유 / 올바르게 고치면?',2,'why'+(on?'':' hide'))}</div>`}).join('')}</div>${PEN?padHTML(id+':x',190,'틀린 보기 번호와 이유를 손으로 써요'):''}`;
 if(q.t==='fill') return `<div class="ink-wrap" data-pad="${id}:o"><div class="fills">${q.f.map((f,i)=>`<div class="fr"><label>${f}</label>${ta(id+':f'+i,'',1)}</div>`).join('')}</div></div>`;
 if(q.t==='essay') return PEN?padHTML(id+':e',(q.r||5)>3?320:200,''):ta(id+':e','답안 작성',q.r||5,'es');
 if(q.t==='tbl') return `<div class="tw"><div class="ink-wrap" data-pad="${id}:o"><table><thead><tr><th></th>${q.tb.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${q.tb.rows.map((r,ri)=>`<tr><th>${r}</th>${q.tb.cols.map((c,ci)=>`<td>${ta(id+':t'+ri+'_'+ci,'',2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;

function clearMarks(id){const el=document.getElementById('q-'+id);if(!el)return;el.querySelectorAll('.opt').forEach(o=>o.classList.remove('right','wrong'));el.querySelectorAll('.ia,.iaz').forEach(x=>x.remove())}
const norm=s=>String(s||'').toLowerCase().replace(/[\s,·()=]/g,'').replace(/→|->/g,'>').replace(/−/g,'-');
function cellOk(inp,ref,c){
 const a=norm(inp),r=norm(ref);
 if(c===5){const yes=['o','0','유','있음','+'],no=['x','무','없음','-'];return (r==='o'&&yes.includes(a))||(r==='x'&&no.includes(a))}
 if(r==='-'||r==='') return a===''||a==='-'||a==='없음'||a==='x';
 if(!a) return false;
 return a===r||(a.length>=3&&(r.includes(a)||a.includes(r)));
}
function grade(id){
 const q=Q.find(x=>x.id===id),cols=q.cols||[0,1,2,3,4,5];let ok=0,tot=0;

  tot++;const good=cellOk(S[`${id}:x${ri}_${c}`],ref,c);
  td.classList.add(good?'ok':'bad');if(good)ok++;else td.insertAdjacentHTML('beforeend',`<span class="fix">${esc(ref)}</span>`);
 }));
 const btn=document.querySelector(`[data-grade="${id}"]`);if(btn)btn.textContent=`표 채점 · ${ok}/${tot}`;

let PEN=false,FINGER=false,TOOL='pen',PCOL='#1a1a1a',PW=2.2,INK={},HIST=[];
try{PEN=localStorage.getItem('avian-pen')==='1';FINGER=localStorage.getItem('avian-finger')==='1'}catch(e){}
let IDB=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('avian-ink',1);r.onupgradeneeded=()=>r.result.createObjectStore('ink');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
async function inkLoad(){
 IDB=await idbOpen();if(!IDB)return;
 await new Promise(res=>{try{const tx=IDB.transaction('ink','readonly'),st=tx.objectStore('ink'),rq=st.openCursor();
  rq.onsuccess=()=>{const c=rq.result;if(c){INK[c.key]=c.value;c.continue()}else res()};rq.onerror=()=>res()}catch(e){res()}});
}
const inkTimers={};
function inkSave(k){clearTimeout(inkTimers[k]);inkTimers[k]=setTimeout(()=>{if(!IDB)return;try{IDB.transaction('ink','readwrite').objectStore('ink').put(INK[k],k)}catch(e){}},400)}
function inkDel(k){if(!IDB)return;try{IDB.transaction('ink','readwrite').objectStore('ink').delete(k)}catch(e){}}
function padHTML(key,hgt,ph){const H=(INK[key]&&INK[key].h)||hgt;return `<div class="padbox"><div class="pad lined" data-pad="${key}" style="height:${H}px">${ph?`<span class="padph">${ph}</span>`:''}</div><button class="btn padmore" data-more="${key}">+ 공간 늘리기</button></div>`}
function penAnsList(q,A){
 let r='<div class="alist">';
 if(q.t==='fill'&&A.f) q.f.forEach((f,i)=>{if(A.f[i]!=null)r+=`<div><b>${f}</b> → ${A.f[i]}</div>`});
 if(q.t==='tbl'&&A.t) q.tb.rows.forEach((row,ri)=>{r+=`<div><b>${row}</b> → ${q.tb.cols.map((c,ci)=>A.t[ri]&&A.t[ri][ci]!=null?`${c}: ${A.t[ri][ci]}`:'').filter(Boolean).join(' / ')}</div>`});
 if(q.t==='cloze'&&A.z) Object.entries(A.z).forEach(([l,v])=>{r+=`<span class="azc"><i>${l}</i> ${v}</span>`});

function mountPads(){
 document.querySelectorAll('[data-pad]').forEach(host=>{
  if(!PEN){if(host._pad){host._pad.destroy();host._pad=null}return}
  if(!host._pad) host._pad=new Pad(host);
 });
}
class Pad{
 constructor(host){
  this.host=host;this.key=host.dataset.pad;this.c=document.createElement('canvas');this.c.className='ink';host.appendChild(this.c);
  this.ctx=this.c.getContext('2d');this.cur=null;this.erasing=false;
  this.ro=new ResizeObserver(()=>this.size());this.ro.observe(host);
  const c=this.c;
  this.onDown=e=>this.down(e);this.onMove=e=>this.move(e);this.onUp=e=>this.up(e);
  c.addEventListener('pointerdown',this.onDown);c.addEventListener('pointermove',this.onMove);
  c.addEventListener('pointerup',this.onUp);c.addEventListener('pointercancel',this.onUp);c.addEventListener('pointerleave',this.onUp);
  this.onTouch=ev=>{if(FINGER){ev.preventDefault();return}for(const t of ev.touches){if(t.touchType==='stylus'){ev.preventDefault();return}}};
  c.addEventListener('touchstart',this.onTouch,{passive:false});c.addEventListener('touchmove',this.onTouch,{passive:false});
  this.size();
 }
 destroy(){this.ro.disconnect();this.c.remove()}
 data(){return INK[this.key]||(INK[this.key]={w:this.w,s:[]})}
 size(){
  const w=this.host.offsetWidth,h=this.host.offsetHeight,d=window.devicePixelRatio||1;
  if(!w||!h)return;if(w===this.w&&h===this.h)return;
  this.w=w;this.h=h;this.c.style.width=w+'px';this.c.style.height=h+'px';this.c.width=Math.round(w*d);this.c.height=Math.round(h*d);
  this.ctx.setTransform(d,0,0,d,0,0);this.c.style.touchAction=FINGER?'none':'pan-x pan-y';this.redraw();
 }
 ok(e){return e.pointerType==='pen'||e.pointerType==='mouse'||(FINGER&&e.pointerType==='touch')}
 pt(e){const r=this.c.getBoundingClientRect();const D=this.data(),sc=(D.w||this.w)/this.w;return [(e.clientX-r.left)*sc,(e.clientY-r.top)*sc,e.pointerType==='pen'?(e.pressure||0.5):0.5]}
 down(e){
  if(!this.ok(e))return;e.preventDefault();this.c.setPointerCapture(e.pointerId);
  const D=this.data();if(!D.w)D.w=this.w;
  if(TOOL==='erase'||e.button===5||(e.buttons&32)){this.erasing=true;this.removed=[];this.erase(this.pt(e));return}
  const p=this.pt(e);this.cur={c:PCOL,w:PW,p:[+p[0].toFixed(1),+p[1].toFixed(1),+p[2].toFixed(2)]};
  const ph=this.host.querySelector('.padph');if(ph)ph.remove();
 }
 move(e){
  if(this.erasing){this.erase(this.pt(e));return}
  if(!this.cur)return;e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of evs){const p=this.pt(ev),P=this.cur.p,n=P.length;
   const lx=P[n-3],ly=P[n-2];if(Math.hypot(p[0]-lx,p[1]-ly)<0.8)continue;
   P.push(+p[0].toFixed(1),+p[1].toFixed(1),+p[2].toFixed(2));this.seg(this.cur,P.length/3-2)}
 }
 up(e){
  if(this.erasing){this.erasing=false;if(this.removed.length){HIST.push({k:this.key,t:'e',s:this.removed});inkSave(this.key);afterInk(this.key)}return}
  if(!this.cur)return;const D=this.data();
  if(this.cur.p.length===3){this.cur.p.push(this.cur.p[0]+0.3,this.cur.p[1]+0.3,this.cur.p[2]);this.seg(this.cur,0)}
  D.s.push(this.cur);HIST.push({k:this.key,t:'a',s:this.cur});this.cur=null;inkSave(this.key);afterInk(this.key);
 }
 erase(p){const D=this.data(),R=10;const keep=[];
  D.s.forEach(st=>{let hit=false;for(let i=0;i<st.p.length;i+=3){if(Math.hypot(st.p[i]-p[0],st.p[i+1]-p[1])<R){hit=true;break}}if(hit)this.removed.push(st);else keep.push(st)});
  if(keep.length!==D.s.length){D.s=keep;this.redraw()}}
 seg(st,i){const ctx=this.ctx,P=st.p,sc=this.w/((this.data().w)||this.w);
  const x0=P[i*3]*sc,y0=P[i*3+1]*sc,x1=P[i*3+3]*sc,y1=P[i*3+4]*sc,pr=P[i*3+5];
  ctx.strokeStyle=st.c;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=st.w*(0.45+pr*1.1)*sc;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke()}
 redraw(){const ctx=this.ctx;ctx.clearRect(0,0,this.w,this.h);const D=INK[this.key];if(!D)return;D.s.forEach(st=>{for(let i=0;i<st.p.length/3-1;i++)this.seg(st,i)})}
}
function afterInk(key){refreshCard(key.split(':')[0])}
function padOf(key){const el=document.querySelector(`[data-pad="${CSS.escape(key)}"]`);return el&&el._pad}
function setPen(on,init){
 PEN=on;try{localStorage.setItem('avian-pen',on?'1':'0')}catch(e){}
 document.body.classList.toggle('pen',on);document.getElementById('penbar').classList.toggle('hide',!on);

 if(b.dataset.col){PCOL=b.dataset.col;TOOL='pen';document.querySelectorAll('.pc').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('pErase').classList.remove('on');return}
 if(b.dataset.w){PW=+b.dataset.w;TOOL='pen';document.querySelectorAll('.pw').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('pErase').classList.remove('on');return}
 if(b.id==='pErase'){TOOL=TOOL==='erase'?'pen':'erase';b.classList.toggle('on',TOOL==='erase');return}
 if(b.id==='pFinger'){FINGER=!FINGER;try{localStorage.setItem('avian-finger',FINGER?'1':'0')}catch(e){}b.classList.toggle('on',FINGER);document.querySelectorAll('canvas.ink').forEach(c=>c.style.touchAction=FINGER?'none':'pan-x pan-y');return}
 if(b.id==='pUndo'){const h=HIST.pop();if(!h)return;const D=INK[h.k];if(!D)return;
  if(h.t==='a')D.s=D.s.filter(s=>s!==h.s);else D.s=D.s.concat(h.s);
  inkSave(h.k);const p=padOf(h.k);if(p)p.redraw();afterInk(h.k);return}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-more]');if(!b)return;const k=b.dataset.more,el=document.querySelector(`[data-pad="${CSS.escape(k)}"]`);if(!el)return;
 const nh=el.offsetHeight+140;el.style.height=nh+'px';const D=INK[k]||(INK[k]={w:el._pad?el._pad.w:el.offsetWidth,s:[]});D.h=nh;inkSave(k)});

/* ===== 이벤트 ===== */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-view],[data-mc],[data-ans],[data-grade],[data-clr],[data-jump],[data-tip]');if(!t)return;
 if(t.dataset.tip){const b=document.getElementById('t-'+t.dataset.tip);if(b)b.classList.toggle('hide');return}
 if(t.dataset.jump){jump(t.dataset.jump);return}
 if(t.dataset.view){view=t.dataset.view;render();window.scrollTo(0,0);return}
 if(t.dataset.mc){const id=t.dataset.mc,v=+t.dataset.v;S[id]=S[id]===v?null:v;if(S[id]===null)delete S[id];save();
  document.querySelectorAll(`#q-${id} .opt`).forEach((o,i)=>{o.classList.toggle('sel',S[id]===i);o.classList.remove('right','wrong')});refreshCard(id);return}
 if(t.dataset.ans){showAns(t.dataset.ans);return}
 if(t.dataset.grade){grade(t.dataset.grade);return}
 if(t.dataset.clr){const id=t.dataset.clr;if(!confirm('이 문제의 내 답을 지울까요?'))return;
  Object.keys(S).forEach(k=>{if(k===id||k.startsWith(id+':'))delete S[k]});save();
  Object.keys(INK).forEach(k=>{if(k.startsWith(id+':')){delete INK[k];inkDel(k)}});
  const q=Q.find(x=>x.id===id),el=document.getElementById('q-'+id);el.outerHTML=card(q);document.querySelectorAll(`#q-${id} textarea`).forEach(fit);mountPads();prog();}
});
document.addEventListener('input',e=>{
 const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
 if(e.target.type==='checkbox'){S[k]=e.target.checked;if(!S[k])delete S[k];
  const lab=e.target.closest('.opt');lab.classList.toggle('sel',e.target.checked);
  const why=lab.nextElementSibling;if(why){why.classList.toggle('hide',!e.target.checked);fit(why)}}
 else{S[k]=e.target.value;if(!S[k])delete S[k];if(e.target.tagName==='TEXTAREA')fit(e.target)}
 save();refreshCard(k.split(':')[0]);
});
document.addEventListener('change',e=>{if(e.target.type==='checkbox'&&e.target.dataset.k){e.target.dispatchEvent(new Event('input',{bubbles:true}))}});
document.getElementById('onlyEmpty').addEventListener('change',render);
document.getElementById('showAll').addEventListener('change',render);
document.getElementById('reset').addEventListener('click',()=>{if(confirm('모든 문제의 내 답(타이핑·필기)을 지울까요? 되돌릴 수 없어요.')){S={};save();Object.keys(INK).forEach(k=>inkDel(k));INK={};render()}});
inkLoad().then(()=>{setPen(PEN,true)});
</script>
</body>
</html>
